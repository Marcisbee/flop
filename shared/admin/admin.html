              </div>
              <div class="analytics-detail-body">
                <div class="detail-row"><div class="detail-key">time</div><div class="detail-val">${fmtTime(selectedLog.ts)}</div></div>
                <div class="detail-row"><div class="detail-key">status</div><div class="detail-val">${String(selectedLog.status ?? '-')}</div></div>
                <div class="detail-row"><div class="detail-key">duration</div><div class="detail-val">${fmtMs(selectedLog.durationMs)}</div></div>
                <div class="detail-row"><div class="detail-key">route</div><div class="detail-val">${selectedLog.routeType}/${selectedLog.routeName}</div></div>
                <div class="detail-row"><div class="detail-key">error</div><div class="detail-val">${selectedLog.errorMessage || '-'}</div></div>
                <div class="detail-row">
                  <div class="detail-key">trace</div>
                  <div class="detail-val">
                    ${traceEvents.length > 0
                      ? html`<div class="trace-timeline">
                        <div class="trace-axis">

                          <div class="trace-axis-grid" style=${{ left: '50%' }}></div>
                          <div class="trace-axis-grid" style=${{ left: '75%' }}></div>
                        </div>
                        <div class="trace-axis-labels">
                          <span>0ms</span>
                          <span>${fmtMs(traceTimeline.totalMs / 2)}</span>
                          <span>${fmtMs(traceTimeline.totalMs)}</span>
                        </div>
                        <div class="trace-list">
                        ${traceTimeline.rows.map((r) => {

                          return html`
                          <div key=${String(r.i)} class="trace-item">
                            <div>
                              <div class="trace-row-top">
                                <div class="trace-name">${t.op || t.name || t.stage || 'operation'}</div>
                                <div class="trace-row-ms">${fmtMs(r.ms)}</div>
                              </div>
                              <div class="trace-meta">
                                ${t.table ? ('table=' + t.table + ' ') : ''}${t.index ? ('index=' + t.index + ' ') : ''}${t.rows != null ? ('rows=' + t.rows + ' ') : ''}${t.note || ''}
                              </div>
                              <div class="trace-bar-wrap">
                                <div class="trace-bar-track">
                                  <div class="trace-bar" style=${{ left: `${r.offsetPct}%`, width: `${r.widthPct}%` }}></div>
                                </div>
                              </div>
                            </div>

                        `;

                        </div>

                      : 'Per-request DB trace not available from backend yet (no scan/index timing emitted).'}
                  </div>
                </div>
                <div class="detail-row">
                  <div class="detail-key">details</div>
                  <div class="detail-val">
                    ${selectedDetails
                      ? html`<pre class="detail-pre">${JSON.stringify(selectedDetails, null, 2)}</pre>`
                      : (selectedLog.details ? html`<pre class="detail-pre">${String(selectedLog.details)}</pre>` : '-')}
                  </div>
                </div>
              </div>
            </aside>
          `}
        </div>
      </div>
    </div>
  `;
}

function ObservePanel() {
  const [loaded, setLoaded] = useState(false);
  const [supported, setSupported] = useState(true);
  const [report, setReport] = useState(null);
  const [runtimeStats, setRuntimeStats] = useState(null);
  const [query, setQuery] = useState('');

  const load = useCallback(async () => {
    try {
      const [indexResp, runtimeResp] = await Promise.all([
        api('/analytics/indexes'),
        api('/analytics/runtime'),
      ]);
      if (!indexResp || !indexResp.data) {
        setSupported(false);
        return;
      }
      setReport(indexResp.data);
      if (runtimeResp && runtimeResp.data) setRuntimeStats(runtimeResp.data);
      setSupported(true);
    } catch {
      setSupported(false);
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 10000);
    return () => clearInterval(id);
  }, [load]);

  if (!loaded) {
    return html`<div class="empty-state"><div class="empty-title">Loading observability…</div></div>`;
  }
  if (!supported) {
    return html`<div class="empty-state"><div class="empty-title">Observe unavailable</div><div class="empty-desc">This runtime does not expose index diagnostics.</div></div>`;
  }

  const tables = Array.isArray(report?.tables) ? report.tables : [];
  const q = query.trim().toLowerCase();
  const filtered = q
    ? tables.filter(t =>
      (t.table || '').toLowerCase().includes(q) ||
      (t.secondaryIndexes || []).some(i =>
        (i.name || '').toLowerCase().includes(q) ||
        (i.type || '').toLowerCase().includes(q) ||
        (i.fields || []).join(',').toLowerCase().includes(q)
      )
    )
    : tables;

  const secondaryEntries = filtered.reduce((sum, t) =>
    sum + (t.secondaryIndexes || []).reduce((inner, i) => inner + (Number(i.entryCount) || 0), 0), 0
  );

  return html`
    <div class="observe-panel">
      <div class="analytics-toolbar">
        <div class="analytics-title">${icons.pulse} Observe</div>
        <div class="analytics-actions">
          <div class="search-box">
            ${icons.search}
            <input type="text" placeholder="Filter tables/indexes…" value=${query} onInput=${e => setQuery(e.target.value)} />
          </div>
        </div>
      </div>

      <div class="observe-body">
        <div class="analytics-cards">
          <div class="analytics-card"><div class="analytics-card-label">Tables</div><div class="analytics-card-value">${fmtCount(report?.tableCount)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Primary Indexes</div><div class="analytics-card-value">${fmtCount(report?.primaryIndexCount)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Secondary Indexes</div><div class="analytics-card-value">${fmtCount(report?.secondaryIndexCount)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Index Entries</div><div class="analytics-card-value">${fmtCount(secondaryEntries)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Estimated Index Payload</div><div class="analytics-card-value">${fmtBytes(report?.estimatedPayloadBytes)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Heap In Use</div><div class="analytics-card-value">${fmtBytes(runtimeStats?.heapInuse)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Heap Idle</div><div class="analytics-card-value">${fmtBytes(runtimeStats?.heapIdle)}</div></div>
          <div class="analytics-card"><div class="analytics-card-label">Go Sys</div><div class="analytics-card-value">${fmtBytes(runtimeStats?.sys)}</div></div>
        </div>

        <div class="observe-table-wrap">
          <div class="panel-toolbar">
            <div class="panel-title">
              <span class="panel-title-icon">${icons.table}</span>
              Indexes By Table
              <span class="panel-meta">${fmtCount(filtered.length)} tables</span>
            </div>
            <div class="panel-meta">snapshot ${fmtTime(report?.generatedAtUnixMilli)}</div>
          </div>
          <div class="table-container panel-table-scroll">
            <table>
              <thead>
                <tr>
                  <th><span class="th-name">table</span></th>
                  <th><span class="th-name">index</span></th>
                  <th><span class="th-name">type</span></th>
                  <th><span class="th-name">entries</span></th>
                  <th><span class="th-name">keys</span></th>
                  <th><span class="th-name">est. payload</span></th>
                  <th><span class="th-name">ready</span></th>
                </tr>
              </thead>
              <tbody>
                ${filtered.length === 0 && html`<tr><td colspan="7" class="empty-row">No matching tables/indexes</td></tr>`}
                ${filtered.map(t => html`
                  <tr key=${t.table + ':primary'}>
                    <td>${t.table}<span class="th-type"> (${fmtCount(t.rows)} rows)</span></td>
                    <td class="mono-sm">${t.primaryKeyField || 'id'} (primary)</td>
                    <td>primary</td>
                    <td>${fmtCount(t.primaryKeys)}</td>
                    <td>${fmtCount(t.primaryKeys)}</td>
                    <td>${fmtBytes(t.primaryEstimatedBytes)}</td>
                    <td>yes</td>
                  </tr>
                  ${(t.secondaryIndexes || []).map(idx => html`
                    <tr key=${t.table + ':' + idx.name}>
                      <td><span class="null">↳</span></td>
                      <td class="mono-sm">${idx.name}${idx.fields && idx.fields.length ? ' [' + idx.fields.join(', ') + ']' : ''}</td>
                      <td>${idx.type}${idx.unique ? ' (u)' : ''}</td>
                      <td>${fmtCount(idx.entryCount)}</td>
                      <td>${fmtCount(idx.keyCount)}</td>
                      <td>${fmtBytes(idx.estimatedPayloadBytes)}</td>
                      <td>${t.secondaryReady ? 'yes' : 'building'}</td>
                    </tr>
                  `)}
                `)}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  `;
}

function MediaPanel() {
  const [rows, setRows] = useState([]);
  const [page, setPage] = useState(1);
  const [pages, setPages] = useState(1);
  const [total, setTotal] = useState(0);
  const [search, setSearch] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [orphansOnly, setOrphansOnly] = useState(false);
  const [loading, setLoading] = useState(false);

  const loadRows = useCallback(async (nextPage = page, nextSearch = searchQuery, nextOrphans = orphansOnly) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ limit: '50', page: String(nextPage) });
      if (nextSearch) params.set('search', nextSearch);
      if (nextOrphans) params.set('orphans', '1');
      const data = await api('/media?' + params.toString());
      setRows(data?.rows || []);
      setTotal(data?.total || 0);
      setPages(Math.max(1, data?.pages || 1));
    } catch (err) {
      showToast(err.message || 'Failed to load media', 'error');
    } finally {
      setLoading(false);
    }
  }, [page, searchQuery, orphansOnly]);

  useEffect(() => { loadRows(page, searchQuery, orphansOnly); }, [page, searchQuery, orphansOnly]);

  const applySearch = useCallback(() => {
    setPage(1);
    setSearchQuery(search.trim());
  }, [search]);

  const onSearchKey = useCallback((e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      applySearch();
    }
  }, [applySearch]);

  return html`
    <div class="panel media-workspace">
      <div class="panel-toolbar">
        <div class="panel-title">
          <span class="panel-title-icon">${icons.image}</span>
          <div><span class="eyebrow">ASSET LIBRARY</span><h1>Media</h1></div>
          <span class="panel-meta">${fmtCount(total)} files</span>
        </div>
        <div class="panel-actions">
          <div class="search-box">
            ${icons.search}
            <input type="text" aria-label="Search media" placeholder="Search files…" value=${search} onInput=${e => setSearch(e.target.value)} onKeyDown=${onSearchKey} />
            <button class="btn-filter" aria-label="Search media files" onClick=${applySearch}>${icons.chevRight}</button>
          </div>
          <label class="btn" style="gap:6px">
            <input type="checkbox" checked=${orphansOnly} onChange=${e => { setPage(1); setOrphansOnly(e.target.checked); }} />
            Orphans only
          </label>
          <button class="btn" onClick=${() => loadRows()} disabled=${loading}>${icons.refresh} Refresh</button>
        </div>
      </div>
      <div class="media-gallery">
        ${rows.length === 0 ? html`<div class="media-empty"><span class="collection-symbol">${icons.image}</span><h2>${loading ? 'Loading media…' : 'No files yet'}</h2><p>${search || orphansOnly ? 'No files match these filters.' : 'Files attached to your records will appear in this library.'}</p></div>` : rows.map((row,idx) => html`<article class="media-asset" key=${row.path || idx}>
          <div class="media-preview">${isImageFile(row) && row.url ? html`<img src=${row.url} alt=${row.name || fileDisplayName(row)} loading="lazy" />` : icons.image}</div>
          <div class="media-asset-info"><strong>${row.url ? html`<a href=${row.url} target="_blank" rel="noopener">${row.name || fileDisplayName(row) || 'File'}</a>` : row.name || row.path}</strong><p>${row.tableName ? row.tableName+' / '+(row.fieldName || '') : 'Unlinked file'}</p><div><span>${fmtBytes(row.diskSize || row.refSize || 0)}</span><span>${row.orphaned ? 'Orphaned' : row.mime || 'File'}</span></div><details><summary>File details</summary><p>${row.path}</p><p>Record: ${row.rowId || 'None'}</p><p>${fmtCount(row.thumbCount || 0)} thumbnails · ${fmtBytes(row.thumbBytes || 0)}</p></details></div>
        </article>`)}
      </div>
      <div class="pagination">
        <button class="btn" disabled=${page <= 1} onClick=${() => setPage(p => Math.max(1, p - 1))}>${icons.chevLeft} Prev</button>
        <span class="page-info">Page ${page} of ${pages}</span>
        <button class="btn" disabled=${page >= pages} onClick=${() => setPage(p => Math.min(pages, p + 1))}>Next ${icons.chevRight}</button>
      </div>
    </div>
  `;
}

function Toggle({ checked, onChange, disabled = false, label }) {

    <button type="button" role="switch" aria-checked=${checked} aria-label=${label} class=${"toggle" + (checked ? " on" : "")} disabled=${disabled} onClick=${() => !disabled && onChange(!checked)}>
      <span class="toggle-knob"></span>
    </button>
  `;
}

function BackupsPage() {
  const [items, setItems] = useState([]);
  const [busy, setBusy] = useState(false);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [creating, setCreating] = useState(false);
  const [testing, setTesting] = useState(false);
  const [testError, setTestError] = useState('');
  const [testOk, setTestOk] = useState(false);
  const [showOptions, setShowOptions] = useState(false);
  const [settings, setSettings] = useState({ cron: '', cronMaxKeep: 3, s3: { enabled: false, endpoint: '', bucket: '', region: '', accessKey: '', secret: '', forcePathStyle: false } });
  const [originalSettings, setOriginalSettings] = useState({ cron: '', cronMaxKeep: 3, s3: { enabled: false, endpoint: '', bucket: '', region: '', accessKey: '', secret: '', forcePathStyle: false } });
  const [downloadBusy, setDownloadBusy] = useState({});
  const [deleteBusy, setDeleteBusy] = useState({});
  const [restoreBusy, setRestoreBusy] = useState({});
  const [uploading, setUploading] = useState(false);

  const clone = useCallback((value) => JSON.parse(JSON.stringify(value)), []);
  const hasChanges = JSON.stringify(settings) !== JSON.stringify(originalSettings);
  const autoEnabled = !!settings.cron;

  const normalizeSettings = useCallback((incoming) => {
    const next = clone(incoming || {});
    if (!next.s3) next.s3 = {};
    return {
      cron: next.cron || '',
      cronMaxKeep: Number(next.cronMaxKeep || 3),
      s3: {
        enabled: !!next.s3.enabled,
        endpoint: next.s3.endpoint || '',
        bucket: next.s3.bucket || '',
        region: next.s3.region || '',
        accessKey: next.s3.accessKey || '',
        secret: next.s3.secret || '',
        forcePathStyle: !!next.s3.forcePathStyle,
      },
    };
  }, [clone]);

  const maybeTestS3 = useCallback(async (candidate) => {
    const current = candidate || settings;
    if (!current?.s3?.enabled) {
      setTestError('');
      setTestOk(false);
      return;
    }
    setTesting(true);
    setTestError('');
    setTestOk(false);
    try {
      await api('/backups/settings/test-s3', {
        method: 'POST',
        body: JSON.stringify({ s3: current.s3 }),
      });
      setTestOk(true);
    } catch (err) {
      setTestError(err.message || 'S3 connection failed');
    } finally {
      setTesting(false);
    }
  }, [settings]);

  const loadPage = useCallback(async () => {
    setLoading(true);
    try {
      const settingsData = await api('/backups/settings');
      const normalized = normalizeSettings(settingsData?.settings || {});
      setSettings(normalized);
      setOriginalSettings(clone(normalized));
      if (normalized.s3.enabled) {
        maybeTestS3(normalized);
      } else {
        setTestError('');
        setTestOk(false);
      }
      try {
        const listData = await api('/backups');
        setItems((listData?.items || []).slice().sort((a, b) => new Date(b.modified) - new Date(a.modified)));
        setBusy(!!listData?.busy || !!settingsData?.busy);
      } catch (err) {
        setItems([]);
        setBusy(!!settingsData?.busy);
        showToast(err.message || 'Failed to load backups list', 'error');
      }
    } catch (err) {
      showToast(err.message || 'Failed to load backups', 'error');
    } finally {
      setLoading(false);
    }
  }, [clone, normalizeSettings, maybeTestS3]);

  useEffect(() => { loadPage(); }, []);

  const setCronEnabled = useCallback((enabled) => {
    setSettings(prev => {
      const next = clone(prev);
      next.cron = enabled ? (next.cron || '0 0 * * *') : '';
      if (enabled && (!next.cronMaxKeep || next.cronMaxKeep < 1)) next.cronMaxKeep = 3;
      return next;
    });
  }, [clone]);

  const setS3Enabled = useCallback((enabled) => {
    setSettings(prev => {
      const next = clone(prev);
      next.s3.enabled = enabled;
      return next;
    });
    if (!enabled) {
      setTestError('');
      setTestOk(false);
    }
  }, [clone]);

  const saveSettings = useCallback(async () => {
    setSaving(true);
    try {
      const payload = clone(settings);
      if (payload.s3?.secret === backupSecretMask && originalSettings.s3?.secret === backupSecretMask) {
        delete payload.s3.secret;
      }
      const res = await api('/backups/settings', {
        method: 'PUT',
        body: JSON.stringify({ settings: payload }),
      });
      const normalized = normalizeSettings(res?.settings || payload);
      setSettings(normalized);
      setOriginalSettings(clone(normalized));
      setBusy(false);
      showToast('Backup settings saved');
      if (normalized.s3.enabled) {
        maybeTestS3(normalized);
      }
    } catch (err) {
      showToast(err.message || 'Failed to save backup settings', 'error');
    } finally {
      setSaving(false);
    }
  }, [settings, originalSettings, clone, normalizeSettings, maybeTestS3]);

  const createBackup = useCallback(async () => {
    setCreating(true);
    try {
      await api('/backups', { method: 'POST', body: '{}' });
      showToast('Backup created');
      await loadPage();
    } catch (err) {
      showToast(err.message || 'Backup failed', 'error');
    } finally {
      setCreating(false);
    }
  }, [loadPage]);

  const downloadBackup = useCallback(async (key) => {
    setDownloadBusy(prev => ({ ...prev, [key]: true }));
    try {
      const res = await fetch('/_/api/backups/' + encodeURIComponent(key) + '/download', {
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = key;
      a.click();
    } catch (err) {
      showToast(err.message || 'Download failed', 'error');
    } finally {
      setDownloadBusy(prev => ({ ...prev, [key]: false }));
    }
  }, []);

  const deleteBackup = useCallback(async (key) => {
    if (!confirm('Delete backup "' + key + '"?')) return;
    setDeleteBusy(prev => ({ ...prev, [key]: true }));
    try {
      await apiDelete('/backups/' + encodeURIComponent(key));
      showToast('Backup deleted');
      await loadPage();
    } catch (err) {
      showToast(err.message || 'Delete failed', 'error');
    } finally {
      setDeleteBusy(prev => ({ ...prev, [key]: false }));
    }
  }, [loadPage]);

  const restoreBackup = useCallback(async (key) => {
    if (!confirm('Restore "' + key + '"?\n\nThis replaces the current database data and files with the selected backup.')) return;
    setRestoreBusy(prev => ({ ...prev, [key]: true }));
    try {
      const res = await api('/backups/' + encodeURIComponent(key) + '/restore', {
        method: 'POST',
        body: '{}',
      });
      showToast(res?.message || 'Backup restored');
      await loadPage();
    } catch (err) {
      showToast(err.message || 'Restore failed', 'error');
    } finally {
      setRestoreBusy(prev => ({ ...prev, [key]: false }));
    }
  }, [loadPage]);

  const uploadBackup = useCallback(async (event) => {
    const file = event?.target?.files?.[0];
    if (!file) return;
    setUploading(true);
    try {
      await apiUpload('/backups/upload', file);
      showToast('Backup uploaded');
      await loadPage();
    } catch (err) {
      showToast(err.message || 'Upload failed', 'error');
    } finally {
      event.target.value = '';
      setUploading(false);
    }
  }, [loadPage]);

  const selectedPreset = settings.cron === '0 0 * * *' ? 'daily'
    : settings.cron === '0 0 * * 0' ? 'weekly'
    : settings.cron === '0 0 * * 1,3' ? 'monwed'
    : settings.cron === '0 0 1 * *' ? 'monthly'
    : 'custom';

  return html`
    <div class=${"backups-page " + (showOptions ? "backup-configuration" : "backup-history")}>
      <div class="backups-hero">
        <div><h1 class="backups-title">Backups</h1><p class="workflow-subtitle">Protect your database and restore a previous version.</p></div>
        <div class="backups-actions">
          <button class="btn" onClick=${loadPage} disabled=${loading || creating || saving}>${icons.refresh} Refresh</button>
          <label class="btn file-upload-btn ${busy || loading || uploading ? 'disabled' : ''}">
            ${uploading ? 'Uploading…' : html`${icons.upload} Upload backup`}
            <input type="file" accept=".zip,application/zip" style="display:none" onChange=${uploadBackup} disabled=${busy || loading || uploading} />
          </label>
        </div>
      </div>

      <div class="view-tabs settings-tabs" aria-label="Backup sections"><button aria-pressed=${!showOptions} onClick=${() => setShowOptions(false)}>Backup history</button><button aria-pressed=${showOptions} onClick=${() => setShowOptions(true)}>Schedule & storage</button></div>
      <div class="backups-card">
        <div class="backups-list">
          ${loading ? html`<div class="backup-empty">Loading backups…</div>` : items.length === 0 ? html`<div class="backup-empty">No backups yet.</div>` : items.map(item => html`
            <div class="backup-row" key=${item.key}>
              <div class="backup-row-main">

const emptyWorkflow = {
  id: '', name: '', category: '', enabled: true,
  trigger: { type: 'row_insert', table: '', events: [] },
  conditions: [], lookups: [],
  ai: { model: '', provider: '', dataCollection: 'deny', prompt: '', resultSchema: {} },
  actions: [{ type: 'queue_review', requireApproval: true }],
  holdUntilComplete: false, subjectPath: '', newUserClearedLimit: 0, maxRetries: 2
};

const cloneWorkflow = (workflow) => JSON.parse(JSON.stringify(workflow || emptyWorkflow));

function workflowRunContent(run) {
  const input = run?.input;
  if (input && typeof input === 'object' && input.row != null) return input.row;
  return input ?? null;
}

function formatWorkflowRunContent(run) {
  const content = workflowRunContent(run);
  if (content == null) return 'No captured input.';
  try {
    return JSON.stringify(content, null, 2);
  } catch {
    return String(content);
  }
}

function workflowValueAtPath(scope, path) {
  let current = scope;
  for (const part of String(path || '').split('.').filter(Boolean)) {
    if (current == null || typeof current !== 'object') return null;
    current = current[part];
  }
  return current;
}

function legacyWorkflowActionEffect(run, workflows) {
  const type = run?.recommendedAction || run?.action || '';
  const workflow = (workflows || []).find(item => item.id === run?.workflowId);
  const action = workflow?.actions?.find(item => item.type === type);
  if (!action) return { type };
  const scope = { input: run.input || {}, lookups: run.lookupResults || {}, result: run.result || {} };
  const effect = { type: action.type, table: action.table || '', field: action.field || '' };
  if (['delete', 'archive', 'block'].includes(action.type)) effect.id = workflowValueAtPath(scope, action.idPath);
  if (action.type === 'block') effect.value = action.value == null ? true : action.value;
  if (['create_alias', 'propose_alias'].includes(action.type)) {
    effect.data = Object.fromEntries(Object.entries(action.data || {}).map(([field, path]) => [field, workflowValueAtPath(scope, path)]));
  }
  return effect;
}

function workflowActionEffectText(run, workflows) {
  const effect = run?.actionEffect || legacyWorkflowActionEffect(run, workflows);
  const type = effect?.type || run?.recommendedAction || run?.action || '';
  const target = effect?.table && effect?.id ? `${effect.table} row ${effect.id}` : (effect?.table || 'the configured target');
  switch (type) {
    case 'approve':
      return run?.holdUntilComplete && run?.table && run?.rowId
        ? `Release ${run.table} row ${run.rowId} from the workflow hold and make it visible.`
        : 'Complete the run without changing application data.';
    case 'queue_review':
      return 'Complete the review without changing application data.';
    case 'delete':
      return `Permanently delete ${target}.`;
    case 'archive':
      return `Archive ${target}.`;
    case 'block': {
      const value = effect?.value === undefined ? true : effect.value;
      return `Set ${effect?.table || 'the configured table'} row ${effect?.id || 'the configured target'} field ${effect?.field || 'the configured field'} to ${JSON.stringify(value)}.`;
    }
    case 'create_alias':
    case 'propose_alias': {
      const fields = Object.entries(effect?.data || {}).map(([field, value]) => `${field}=${JSON.stringify(value)}`).join(', ');
      return `Create a row in ${effect?.table || 'the configured alias table'}${fields ? ` with ${fields}` : ''}.`;
    }
    case 'rejected':
      return 'No action was taken.';
    default:
      return type ? `Run the configured ${type.replaceAll('_', ' ')} action.` : 'No action has been selected yet.';
  }
}

function workflowActionOutcome(run, workflows) {
  const effect = workflowActionEffectText(run, workflows);
  if (run?.status === 'awaiting_approval') return { state: 'Awaiting admin decision', effect: `Approval will: ${effect}` };
  if (run?.status === 'error') return { state: 'No action taken', effect: run.error || 'The run failed before an action completed.' };
  if (run?.status === 'cancelled') return { state: 'No action taken', effect: run.reasoning || 'The run was cancelled.' };
  if (run?.status === 'pending') return { state: 'No action yet', effect: 'Waiting for model evaluation.' };
  if (run?.status === 'running') return { state: 'No action yet', effect: 'Model evaluation is in progress.' };
  if (run?.status === 'completed' && run?.action === 'rejected') return { state: 'Declined by admin', effect: `No action was taken. Declined action: ${effect}` };
  if (run?.status === 'completed') {
    const noDataChange = ['approve', 'queue_review'].includes(run?.action);
    return { state: noDataChange ? 'Completed — no data change' : 'Action taken', effect };
  }
  return { state: 'No action yet', effect };
}

    try {
      await Promise.all([loadConfig(), loadRuns()]);
    } catch (err) {
      showToast(err.message || 'Failed to load workflow', 'error');
    } finally {
      setLoading(false);
    }
  }, [loadConfig, loadRuns]);

  useEffect(() => { loadAll(); }, []);
  useEffect(() => { if (!loading) loadRuns(); }, [status]);
  useEffect(() => {
    if (!inspectingRun) return;
    const closeOnEscape = (event) => {
      if (event.key === 'Escape') setInspectingRun(null);
    };
    window.addEventListener('keydown', closeOnEscape);
    return () => window.removeEventListener('keydown', closeOnEscape);
  }, [inspectingRun]);

  const editWorkflow = useCallback((workflow) => {
    const next = cloneWorkflow(workflow);
    next.trigger = next.trigger || { type: 'manual' };

    next._lookupsJSON = JSON.stringify(next.lookups || [], null, 2);
    next._schemaJSON = JSON.stringify(next.ai.resultSchema || {}, null, 2);

  const update = useCallback((field, value) => setEditing(prev => ({ ...prev, [field]: value })), []);

  const updateAI = useCallback((field, value) => setEditing(prev => ({ ...prev, ai: { ...(prev.ai || {}), [field]: value } })), []);

    if (!editing) return;
    setSaving(true);
    try {
      const payload = cloneWorkflow(editing);
      payload.conditions = JSON.parse(payload._conditionsJSON || '[]');
      payload.lookups = JSON.parse(payload._lookupsJSON || '[]');
      payload.actions = JSON.parse(payload._actionsJSON || '[]');
      payload.ai.resultSchema = JSON.parse(payload._schemaJSON || '{}');
      delete payload._conditionsJSON;
      delete payload._lookupsJSON;
      delete payload._actionsJSON;
      delete payload._schemaJSON;
      const path = payload.id ? ('/workflows/' + encodeURIComponent(payload.id)) : '/workflows';
      await api(path, { method: payload.id ? 'PUT' : 'POST', body: JSON.stringify(payload) });

      setEditing(null);
      await loadConfig();

    }
  }, [editing, loadConfig]);

  const remove = useCallback(async (workflow) => {

      await apiDelete('/workflows/' + encodeURIComponent(workflow.id));

      await loadConfig();
    } catch (err) {

  const resolve = useCallback(async (run, action) => {

      await api('/workflows/runs/' + encodeURIComponent(run.id) + '/resolve', {

              <div class="row-editor-field">

                  ${['row_insert','row_update','report','discord','manual'].map(v => html`<option value=${v} key=${v}>${v.replace('_', ' ')}</option>`)}
                </select>
              </div>
              ${['row_insert','row_update','report'].includes(editing.trigger?.type) && html`
                <div class="row-editor-field">
                  <label>Trigger table</label>
                  <select value=${editing.trigger?.table || ''} onChange=${e => updateTrigger('table', e.target.value)}>

                    ${appTables.map(t => html`<option key=${t.name} value=${t.name}>${t.name}</option>`)}
                  </select>
                </div>
              `}
              ${['discord','report'].includes(editing.trigger?.type) && html`
                <div class="row-editor-field">
                  <label>Event name (optional)</label>
                  <input placeholder="activity_mismatch" value=${editing.trigger?.event || ''} onInput=${e => updateTrigger('event', e.target.value)} />
                </div>
              `}
              <div class="row-editor-field">
                <label>Model</label>
                <input placeholder="provider/model-name" value=${editing.ai?.model || ''} onInput=${e => updateAI('model', e.target.value)} />
              </div>
              <div class="row-editor-field">
                <label>OpenRouter provider slug (optional)</label>
                <input placeholder="openai" value=${editing.ai?.provider || ''} onInput=${e => updateAI('provider', e.target.value)} />
              </div>
              <div class="row-editor-field">
                <label>Provider data collection</label>
                <select value=${editing.ai?.dataCollection || 'deny'} onChange=${e => updateAI('dataCollection', e.target.value)}>
                  <option value="deny">Deny (private providers only)</option>

              </div>
              <div class="row-editor-field">
                <label>Stop per-subject workflow after completed runs</label>
                <input type="number" min="0" value=${editing.newUserClearedLimit || 0} onInput=${e => update('newUserClearedLimit', Number(e.target.value || 0))} />
              </div>
              <div class="row-editor-field">
                <label>Subject path</label>
                <input placeholder="input.row.userId" value=${editing.subjectPath || ''} onInput=${e => update('subjectPath', e.target.value)} />
              </div>
              <div class="row-editor-field">
                <label>Automatic retries</label>
                <input type="number" min="0" max="10" value=${editing.maxRetries || 0} onInput=${e => update('maxRetries', Number(e.target.value || 0))} />
              </div>
            </div>
            <div class="row-editor-field">
              <label>AI prompt</label>
              <textarea value=${editing.ai?.prompt || ''} onInput=${e => updateAI('prompt', e.target.value)}></textarea>
            </div>
            <div class="workflow-checks">
              <label class="workflow-check"><input type="checkbox" checked=${editing.enabled} onChange=${e => update('enabled', e.target.checked)} /> Enabled</label>
              <label class="workflow-check"><input type="checkbox" checked=${editing.holdUntilComplete} onChange=${e => update('holdUntilComplete', e.target.checked)} /> Hold row visibility until complete</label>
            </div>
            <div class="workflow-form-grid">
              ${[
                ['_conditionsJSON', 'Conditions', '[{"field":"input.row.kind","operator":"equals","value":"post"}]'],
                ['_lookupsJSON', 'Lookups / tools', '[{"name":"candidates","type":"search","table":"games","inputPath":"input.name","searchFields":["name"],"limit":10}]'],
                ['_schemaJSON', 'Structured result JSON Schema', '{"type":"object","properties":{...}}'],
                ['_actionsJSON', 'Actions', '[{"type":"delete","table":"posts","idPath":"input.rowId","requireApproval":true}]']
              ].map(([field, label, placeholder]) => html`
                <div class="row-editor-field" key=${field}>
                  <label>${label} (JSON)</label>
                  <textarea placeholder=${placeholder} value=${editing[field] || ''} onInput=${e => update(field, e.target.value)}></textarea>
                </div>
              `)}
            </div>
            <div class="workflow-meta">
              Paths may reference <code>input</code>, <code>lookups</code>, and <code>result</code>. Sensitive actions can set <code>requireApproval</code>.
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn" onClick=${() => setEditing(null)}>Cancel</button>
              <button class="btn btn-primary" disabled=${saving} onClick=${save}>${saving ? 'Saving…' : 'Save workflow'}</button>
            </div>
          </div>
      `}
    </div>
  `;
}

// ── Main App ──
function App() {
  const [loadingTables, setLoadingTables] = useState(true);
  const [tablesError, setTablesError] = useState('');
  const [tables, setTables] = useState([]);
  const [archiveTables, setArchiveTables] = useState([]);
  const [currentTable, setCurrentTable] = useState(null);
  const [currentArchive, setCurrentArchive] = useState(false);
  const [viewMode, setViewMode] = useState('table');
  const [analyticsEnabled, setAnalyticsEnabled] = useState(false);
  const [mediaEnabled, setMediaEnabled] = useState(false);
  const [observeEnabled, setObserveEnabled] = useState(false);
  const [workflowEnabled, setWorkflowEnabled] = useState(false);
  const evtRef = useRef(null);

  const loadTables = useCallback(async () => {
    setLoadingTables(true);
    setTablesError('');
    try {
      const data = await api('/tables');
      if (data) setTables(data.tables || []);
      const archiveData = await api('/archive/tables').catch(() => null);
      if (archiveData) setArchiveTables(archiveData.tables || []);
    } catch (err) { setTablesError(err.message || 'Unable to load tables'); }
    finally { setLoadingTables(false); }
  }, []);

  // SSE change signal — bumped for the currently viewed table so DataTable can debounce-reload
  const [sseSignal, setSseSignal] = useState(0);

  // SSE — batch rapid events into a single state update per animation frame
  useEffect(() => {
    const pendingDeltas = {};   // tableName -> net count delta
    const dirtyRefCache = {};   // tables whose refCache needs clearing
    let rafId = 0;

    function flushDeltas() {
      rafId = 0;
      const deltas = Object.assign({}, pendingDeltas);
      const dirty = Object.keys(dirtyRefCache);
      // Clear accumulators
      for (const k in pendingDeltas) delete pendingDeltas[k];
      for (const k in dirtyRefCache) delete dirtyRefCache[k];
      // Invalidate ref cache for changed tables
      for (const t of dirty) delete refCache[t];
      // Bump SSE signal so DataTable can debounce-reload
      if (dirty.length > 0) setSseSignal(c => c + 1);
      // Single state update for all accumulated changes
      setTables(prev => {
        let changed = false;
        const next = prev.map(t => {
          const d = deltas[t.name];
          if (d === undefined || d === 0) return t;
          changed = true;
          return { ...t, rowCount: Math.max(0, t.rowCount + d) };
        });
        return changed ? next : prev;
      });
    }

    function scheduleFlush() {
      if (!rafId) rafId = requestAnimationFrame(flushDeltas);
    }

    function connect() {
      if (evtRef.current) evtRef.current.close();
      const es = new EventSource('/_/api/events?_token=' + TOKEN);
      evtRef.current = es;

      es.addEventListener('snapshot', (e) => {
        try {
          const { tableCounts } = JSON.parse(e.data);
          if (tableCounts) {
            setTables(prev => prev.map(t => tableCounts[t.name] !== undefined ? { ...t, rowCount: tableCounts[t.name] } : t));
          }
        } catch {}
      });

      es.addEventListener('change', (e) => {
        try {
          const evt = JSON.parse(e.data);
          dirtyRefCache[evt.table] = 1;
          if (evt.op === 'insert') pendingDeltas[evt.table] = (pendingDeltas[evt.table] || 0) + 1;
          else if (evt.op === 'delete') pendingDeltas[evt.table] = (pendingDeltas[evt.table] || 0) - 1;
          // updates don't change count — still schedule to clear refCache
          scheduleFlush();
        } catch {}
      });

      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
    return () => {
      if (evtRef.current) evtRef.current.close();
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  useEffect(() => { loadTables(); }, []);
  useEffect(() => {
    api('/media?limit=1').then(() => {
      setMediaEnabled(true);
    }).catch(() => setMediaEnabled(false));
    api('/analytics/config').then((data) => {
      if (data && data.enabled) setAnalyticsEnabled(true);
    }).catch(() => setAnalyticsEnabled(false));
    api('/analytics/indexes').then((data) => {
      if (data && data.data) setObserveEnabled(true);
    }).catch(() => setObserveEnabled(false));
    api('/workflows/config').then((data) => {
      setWorkflowEnabled(!!data?.enabled);
    }).catch(() => setWorkflowEnabled(false));
  }, []);

  // Hash sync
  useEffect(() => {
    function read() {
      const h = window.location.hash.slice(1);
      if (!h) { setViewMode('table'); setCurrentTable(null); setCurrentArchive(false); return; }
      let decoded;
      try { decoded = decodeURIComponent(h.split('/')[0]); } catch { return; }
      if (decoded === '_analytics' || decoded === '_analytics-volume') {
        setViewMode('analytics-volume');
        return;
      }
      if (decoded === '_analytics-performance') {
        setViewMode('analytics-performance');
        return;
      }
      if (decoded === '_observe') {
        setViewMode('observe');
        return;
      }
      if (decoded === '_backups') {
        setViewMode('backups');
        return;
      }
      if (decoded === '_mail') {
        setViewMode('mail');
        return;
      }
      if (decoded === '_media') {
        setViewMode('media');
        return;
      }
      if (decoded === '_workflow') {
        setViewMode('workflow');
        return;
      }
      if (h.startsWith('_archive/')) {
        setViewMode('table');
        setCurrentArchive(true);
        setCurrentTable(decodeURIComponent(h.slice('_archive/'.length)));
        return;
      }
      setViewMode('table');
      setCurrentArchive(false);
      setCurrentTable(decoded);
    }
    read();
    window.addEventListener('hashchange', read);
    return () => window.removeEventListener('hashchange', read);
  }, []);

  const selectTable = useCallback((name) => {
    setViewMode('table');
    setCurrentArchive(false);
    setCurrentTable(name);
    window.location.hash = encodeURIComponent(name);
  }, []);

  const selectArchive = useCallback((name) => {
    setViewMode('table');
    setCurrentArchive(true);
    setCurrentTable(name);
    window.location.hash = '_archive/' + encodeURIComponent(name);
  }, []);

  const selectAnalyticsVolume = useCallback(() => {
    setViewMode('analytics-volume');
    window.location.hash = '_analytics-volume';
  }, []);

  const selectAnalyticsPerformance = useCallback(() => {
    setViewMode('analytics-performance');
    window.location.hash = '_analytics-performance';
  }, []);

  const selectObserve = useCallback(() => {
    setViewMode('observe');
    window.location.hash = '_observe';
  }, []);

  const selectMedia = useCallback(() => {
    setViewMode('media');
    window.location.hash = '_media';
  }, []);

  const selectBackups = useCallback(() => {
    setViewMode('backups');
    window.location.hash = '_backups';
  }, []);

  const selectMail = useCallback(() => {
    setViewMode('mail');
    window.location.hash = '_mail';
  }, []);

  const selectWorkflow = useCallback(() => {
    setViewMode('workflow');
    window.location.hash = '_workflow';
  }, []);

  useLayoutEffect(() => {
    const app = document.getElementById('app');
    app.scrollTop = 0;
    const frame = requestAnimationFrame(() => { app.scrollTop = 0; });
    return () => cancelAnimationFrame(frame);
  }, [viewMode, currentTable, currentArchive]);

  const currentSchema = useMemo(() => {
    if (!currentTable) return null;
    const source = currentArchive ? archiveTables : tables;
    const t = source.find(t => t.name === currentTable);
    return t ? t.schema : null;
  }, [tables, archiveTables, currentTable, currentArchive]);

  return html`
    <${WorkspaceNavigation} viewMode=${viewMode} analyticsEnabled=${analyticsEnabled} observeEnabled=${observeEnabled} workflowEnabled=${workflowEnabled} mediaEnabled=${mediaEnabled} tables=${tables} archiveTables=${archiveTables} currentTable=${currentTable} currentArchive=${currentArchive} selectTable=${selectTable} selectArchive=${selectArchive} />
    <div class="workspace-content">
      <main class="main" id="main-content">
      ${(viewMode === 'analytics-volume' || viewMode === 'analytics-performance') && analyticsEnabled
        ? html`<${AnalyticsPanel} page=${viewMode === 'analytics-performance' ? 'performance' : 'volume'} />`
        : viewMode === 'media' && mediaEnabled
        ? html`<${MediaPanel} />`
        : viewMode === 'observe' && observeEnabled
        ? html`<${ObservePanel} />`
        : viewMode === 'mail'
        ? html`<${MailSettingsPage} />`
        : viewMode === 'backups'
        ? html`<${BackupsPage} />`
        : viewMode === 'workflow' && workflowEnabled
        ? html`<${WorkflowPage} tables=${tables} />`
        : currentTable
        ? html`<${DataTable} key=${(currentArchive ? 'archive:' : 'table:') + currentTable} tableName=${currentTable} tableMeta=${(currentArchive ? archiveTables : tables).find(t => t.name === currentTable)} schema=${currentSchema} archive=${currentArchive} onReload=${loadTables} sseSignal=${sseSignal} />`
        : html`<${Overview} tables=${tables} archiveTables=${archiveTables} onSelectArchive=${selectArchive} loading=${loadingTables} error=${tablesError} onRetry=${loadTables} onSelect=${selectTable} />`
      }
    </main></div>
    <${Toasts} />
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body></html>
