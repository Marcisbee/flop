<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flop Admin</title>
<style>
/* Analytics */
.analytics-panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.analytics-toolbar{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0}
.analytics-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--text-heading)}
.analytics-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.analytics-select{padding:5px 8px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:8px;color:var(--text);font-size:14px}
.analytics-body{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.analytics-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.analytics-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.analytics-card-label{color:var(--text-muted);font-size:14px;text-transform:uppercase;letter-spacing:0.6px}
.analytics-card-value{margin-top:4px;color:var(--text-heading);font-size:18px;font-variant-numeric:tabular-nums}
.analytics-chart-wrap{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.analytics-chart-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--text-muted);font-size:14px}
.analytics-chart-box{position:relative}
.analytics-chart{width:100%;height:156px;display:block}
.analytics-legend{display:flex;gap:14px;color:var(--text-muted);font-size:14px;margin-top:6px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-line{width:14px;height:2px;border-radius:1px}
.analytics-tooltip{position:absolute;z-index:5;min-width:180px;max-width:260px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,0.25);pointer-events:none}
.tooltip-time{color:var(--text-heading);font-size:14px;margin-bottom:6px}
.tooltip-row{display:flex;justify-content:space-between;gap:8px;color:var(--text-muted);font-size:14px}
.analytics-route-list{display:flex;flex-wrap:wrap;gap:6px}
.analytics-route-chip{font-size:14px;padding:2px 6px;border:1px solid var(--border-input);border-radius:999px;background:var(--bg-input);color:var(--text-muted);cursor:pointer}
.analytics-route-chip.active{border-color:var(--accent);color:var(--text-heading)}
.analytics-logs{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.analytics-empty{padding:24px;color:var(--text-muted);text-align:center}
.log-row{cursor:pointer}
.log-row:hover{background:var(--bg-hover)}
.analytics-layout{display:flex;gap:12px;min-height:0}
.analytics-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.analytics-detail{width:320px;max-width:38vw;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:min(72vh,780px)}
.analytics-detail-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.analytics-detail-title{font-size:14px;font-weight:600;color:var(--text-heading)}
.analytics-detail-body{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.detail-row{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:start}
.detail-key{font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.detail-val{font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px;color:var(--text);word-break:break-word;white-space:pre-wrap}
.detail-pre{margin:0;padding:8px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:8px;max-height:260px;overflow:auto}
.slow-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:999px;background:var(--danger-hover-bg);color:var(--danger-hover-text);font-size:14px;font-weight:600}
.trace-list{display:flex;flex-direction:column;gap:6px}
.trace-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:8px}
.trace-name{font-size:14px;color:var(--text)}
.trace-meta{font-size:14px;color:var(--text-faint)}
.trace-timeline{display:flex;flex-direction:column;gap:6px}
.trace-axis{position:relative;height:18px;border:1px solid var(--border-input);border-radius:8px;background:linear-gradient(90deg, rgba(130,150,170,0.08) 0%, rgba(130,150,170,0.02) 100%)}
.trace-axis-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--border-input);opacity:0.55}
.trace-axis-labels{display:flex;justify-content:space-between;font-size:14px;color:var(--text-muted);padding:0 1px}
.trace-bar-wrap{display:flex;flex-direction:column;gap:2px}
.trace-bar-track{position:relative;height:16px;border:1px solid var(--border-input);border-radius:8px;background:rgba(127,127,127,0.06);overflow:hidden}
.trace-bar{position:absolute;top:1px;bottom:1px;border-radius:8px;min-width:2px;background:linear-gradient(90deg, rgba(41,179,255,0.95), rgba(30,130,220,0.95))}
.trace-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trace-row-ms{font-size:14px;color:var(--text-muted)}
.observe-panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.observe-body{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.observe-table-wrap{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel-table-scroll{flex:1;min-height:0;max-height:min(52vh,560px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mono-sm{font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px}

/* Backups */
.workflow-page{display:flex;flex-direction:column;flex:1;overflow:auto;padding:28px 32px;gap:16px}
.workflow-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.workflow-title{font-size:24px;font-weight:600;color:var(--text-heading)}
.workflow-subtitle{margin-top:4px;color:var(--text-muted);line-height:1.4}
.workflow-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.workflow-tab{padding:8px 12px;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-muted);cursor:pointer}
.workflow-tab.active{border-bottom-color:var(--accent);color:var(--text-heading)}
.workflow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.workflow-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.workflow-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.workflow-name{font-size:15px;font-weight:600;color:var(--text-heading)}
.workflow-meta{font-size:14px;color:var(--text-muted);margin-top:3px}
.workflow-badges{display:flex;flex-wrap:wrap;gap:5px}
.workflow-badge{padding:2px 7px;border-radius:999px;background:var(--bg-input);border:1px solid var(--border-input);font-size:14px;color:var(--text-muted)}
.workflow-badge.on{color:#42b983;border-color:rgba(66,185,131,.35)}
.workflow-form{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.workflow-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.workflow-form .row-editor-field textarea{min-height:96px}
.workflow-checks{display:flex;flex-wrap:wrap;gap:14px}
.workflow-check{display:flex;align-items:center;gap:6px;color:var(--text)}
.workflow-warning{padding:10px 12px;border:1px solid rgba(244,135,113,.35);border-radius:10px;background:rgba(244,135,113,.08);color:var(--error)}
.workflow-run-detail{white-space:normal;line-height:1.4;min-width:220px;max-width:420px}
.workflow-run-label{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);margin-bottom:3px}
.workflow-run-action-state{font-weight:600;color:var(--text-heading)}
.workflow-run-effect{margin-top:5px;color:var(--text)}
.workflow-run-reasoning{white-space:normal;line-height:1.45;min-width:220px;max-width:480px;color:var(--text)}
.workflow-run-controls{display:flex;flex-wrap:wrap;gap:4px;min-width:110px}
.workflow-run-source{white-space:normal;min-width:150px}
.workflow-run-source-name{font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;color:var(--text-heading);font-size:14px}
.workflow-run-source-action{margin-top:6px}
.workflow-source-backdrop{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:24px}
.workflow-source-dialog{width:min(720px,100%);max-height:min(760px,calc(100vh - 48px));background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.workflow-source-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.workflow-source-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.workflow-source-content{margin:0;padding:12px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px;line-height:1.5;color:var(--text)}
.status-pill{display:inline-flex;padding:2px 7px;border-radius:999px;background:var(--bg-input);border:1px solid var(--border-input);font-size:14px}
.status-pill.completed{color:#42b983}
.status-pill.error{color:var(--error)}
.status-pill.awaiting_approval{color:#e5b567}

.backups-page{display:flex;flex-direction:column;flex:1;overflow:auto;padding:28px 32px;gap:18px}
.backups-hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.backups-title{font-size:24px;font-weight:600;color:var(--text-heading)}
.backups-actions{display:flex;align-items:center;gap:8px}
.backups-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.backups-list{display:flex;flex-direction:column}
.backup-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--row-border)}
.backup-row:last-child{border-bottom:none}
.backup-row-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.backup-row-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-heading)}
.backup-row-size{color:var(--text-muted);white-space:nowrap}
.backup-row-meta{font-size:14px;color:var(--text-faint)}
.backup-row-actions{display:flex;align-items:center;gap:4px}
.backup-init{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border:none;background:none;color:var(--text-heading);font-size:15px;font-weight:600;cursor:pointer;width:100%}
.backup-init:hover{background:var(--bg-hover)}
.backup-init:disabled{opacity:0.55;cursor:default}
.backup-settings-toggle{display:inline-flex;align-items:center;gap:8px}
.backups-options{padding:18px 0 2px;display:flex;flex-direction:column;gap:22px}
.backup-option-block{display:flex;flex-direction:column;gap:14px}
.backup-option-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.backup-option-row.backup-option-row-3{grid-template-columns:2fr 1fr 1fr}
.backup-label{display:block;font-size:14px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.backup-help{font-size:14px;color:var(--text-muted);line-height:1.35}
.backup-input,.backup-select{width:100%;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:10px;color:var(--text);font-size:14px;outline:none}
.backup-input:focus,.backup-select:focus{border-color:var(--accent)}
.backup-checkbox{display:flex;align-items:center;gap:8px;color:var(--text)}
.backup-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:36px}
.backup-status-ok{display:inline-flex;align-items:center;gap:6px;color:#42b983;background:rgba(66,185,131,0.12);padding:6px 10px;border-radius:999px;font-size:14px}
.backup-status-error{display:inline-flex;align-items:center;gap:6px;color:var(--error);background:rgba(244,135,113,0.12);padding:6px 10px;border-radius:999px;font-size:14px}
.backup-empty{padding:22px 16px;color:var(--text-muted);text-align:center}
.toggle{position:relative;width:40px;height:22px;border-radius:999px;border:none;background:var(--border-input);cursor:pointer;transition:background .15s ease}
.toggle.on{background:#39b980}
.toggle-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:#fff;transition:transform .15s ease}
.toggle.on .toggle-knob{transform:translateX(18px)}
.toggle:disabled{opacity:0.5;cursor:default}
.mail-page{display:flex;flex-direction:column;flex:1;overflow:auto;padding:28px 32px;gap:18px}
.mail-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.mail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mail-grid.mail-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mail-section{display:flex;flex-direction:column;gap:14px}
.mail-textarea{width:100%;min-height:180px;padding:12px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:10px;color:var(--text);font-size:14px;font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;outline:none;resize:vertical}
.mail-textarea:focus{border-color:var(--accent)}
.mail-template-card{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated)}
.mail-template-title{font-size:14px;font-weight:600;color:var(--text-heading)}
.mail-inline-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mail-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width: 980px) {
  .backup-option-row,.backup-option-row.backup-option-row-3{grid-template-columns:1fr}
  .mail-grid,.mail-grid.mail-grid-4{grid-template-columns:1fr}
}

/* File fields */
.file-display{display:inline-flex;align-items:center;gap:6px}
.file-thumb{width:20px;height:20px;object-fit:cover;border-radius:2px;vertical-align:middle}
.file-link{color:var(--accent);text-decoration:none;font-family:'SF Mono',Monaco,'Cascadia Code','Fira Code',monospace;font-size:14px}
.file-link:hover{text-decoration:underline}
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2)}
.file-item-main{display:inline-flex;align-items:center;gap:8px;min-width:0}
.file-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-cell-editor{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--bg);outline:1px solid var(--accent);outline-offset:-1px;z-index:2}
.file-upload-btn{cursor:pointer}
.file-remove{color:var(--danger)}
.btn-sm{padding:2px 6px;font-size:14px}
.file-input-wrap{display:flex;align-items:center;gap:8px}
.file-input-name{color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}


/* Console foundation. One token set, one desktop layout, one compact layout. */
:root{color-scheme:dark;--accent:#64d8a2;--accent-hover:#83e2b6;--bg:#141414;--bg-surface:#181818;--bg-elevated:#202020;--bg-input:#1b1b1b;--bg-hover:#252525;--bg-active:#20362b;--border:#303030;--border-input:#424242;--row-border:#2b2b2b;--text:#dedede;--text-heading:#f3f3f3;--text-muted:#a9a9a9;--text-faint:#a9a9a9;--text-dimmed:#a9a9a9;--text-ghost:#999;--danger:#ffa0a0;--error:#ffa0a0;--danger-hover-bg:#3c2222;--danger-hover-text:#ffb7b7;--scrollbar-thumb:#444;--scrollbar-thumb-hover:#666;--panel-2:var(--bg-elevated);--shadow:0 16px 48px #0005;--page-gutter:24px}
*{box-sizing:border-box;margin:0;padding:0}body{font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit;text-decoration:none}small{font-size:14px}h1,h2,h3{color:var(--text-heading)}h1{font-size:22px;font-weight:600;letter-spacing:-.5px}h2{font-size:17px;font-weight:600;letter-spacing:-.2px}svg.icon-tabler{display:block;flex:0 0 auto;width:18px;height:18px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:active:not(:disabled){transform:translateY(1px)}input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:1}input:not([type=checkbox]):not([type=file]),select,textarea{font-size:16px;min-height:38px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.btn,.btn-icon,.btn-filter{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;line-height:20px;border-radius:5px;font-size:14px;flex-shrink:0}.btn{padding:7px 12px;font-weight:500;border:1px solid var(--border-input);background:var(--bg-input);color:var(--text);white-space:nowrap}.btn:hover{background:var(--bg-hover)}.btn-primary,.row-editor-field label.btn-primary{background:#52c18c;border-color:#52c18c;color:#0c2618}.btn-primary:hover{background:#6cd29f;border-color:#6cd29f;color:#0c2618}.btn-icon{width:36px;height:36px;padding:0;background:none;border:1px solid transparent;color:var(--text-muted)}.btn-icon:hover,.btn-icon.active{background:var(--bg-hover);color:var(--text-heading)}.btn-icon.danger:hover{color:var(--danger);background:var(--danger-hover-bg)}.btn-filter{width:32px;height:32px;min-height:32px;padding // ── Auth ──
let TOKEN = localStorage.getItem('flop_admin_token');
if (!TOKEN) window.location.href = '/_/login';

let _refreshing = null;
async function refreshToken() {
  if (_refreshing) return _refreshing;
  const rt = localStorage.getItem('flop_admin_refresh');
  if (!rt) { logout(); throw new Error('No refresh token'); }
  _refreshing = fetch('/_/api/refresh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refreshToken: rt })
  }).then(async r => {
    _refreshing = null;
    if (!r.ok) { logout(); throw new Error('Refresh failed'); }
    const data = await r.json();
    TOKEN = data.token;
    localStorage.setItem('flop_admin_token', data.token);
    return data.token;
  }).catch(err => { _refreshing = null; throw err; });
  return _refreshing;
}

async function api(path, opts = {}) {
  const doFetch = () => fetch('/_/api' + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...opts.headers }
  });
  let r = await doFetch();
  if (r.status === 401) {
    try { await refreshToken(); r = await doFetch(); } catch { return; }
  }
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('Unauthorized'); }
  const isJSON = r.headers.get('content-type')?.includes('json');
  if (!r.ok) {
    if (isJSON) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || data.message || ('HTTP ' + r.status));
    }
    throw new Error('HTTP ' + r.status);
  }
  if (isJSON) return r.json();
  return r;
}

async function apiUpload(path, file) {
  const form = new FormData();
  form.append('file', file);
  const doFetch = () => fetch('/_/api' + path, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN },
    body: form
  });
  let r = await doFetch();
  if (r.status === 401) {
    try { await refreshToken(); r = await doFetch(); } catch { return; }
  }
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('Unauthorized'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || ('HTTP ' + r.status));
  return data;
}

async function apiDelete(path) {
  const doFetch = () => fetch('/_/api' + path, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  });
  let r = await doFetch();
  if (r.status === 401) {
    try { await refreshToken(); r = await doFetch(); } catch { return; }
  }
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('Unauthorized'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || ('HTTP ' + r.status));
  return data;
}

function logout() {
  localStorage.removeItem('flop_admin_token');
  localStorage.removeItem('flop_admin_refresh');
  window.location.href = '/_/login';
}

// ── Ref data cache ──
const refCache = {};
async function fetchRefOptions(tableName) {
  if (refCache[tableName]) return refCache[tableName];
  try {
    const data = await api('/tables/' + tableName + '/rows?limit=500');
    const rows = data.rows || [];
    const options = rows.map(r => {
      const keys = Object.keys(r);
      const id = r[keys[0]];
      const label = keys.length > 1 ? (r[keys[1]] || id) : id;
      return { id: String(id), label: String(label) };
    });
    refCache[tableName] = options;
    return options;
  } catch { return []; }
}

// ── Helpers ──
function isAutoField(schema, col) {
  if (!schema) return false;
  return Object.keys(schema)[0] === col;
}
function isReadOnly(schema, col) {
  if (!schema || !schema[col]) return false;
  return schema[col].type === 'bcrypt' || schema[col].cached === true;
}
function truncate(s, n = 60) {
  if (s == null) return '';
  const str = String(s);
  return str.length > n ? str.slice(0, n) + '...' : str;
}

function formatBytes(bytes) {
  const num = Number(bytes || 0);
  if (num < 1024) return num + ' B';
  if (num < 1024 * 1024) return (num / 1024).toFixed(2).replace(/\.00$/, '') + ' KB';
  if (num < 1024 * 1024 * 1024) return (num / (1024 * 1024)).toFixed(2).replace(/\.00$/, '') + ' MB';
  return (num / (1024 * 1024 * 1024)).toFixed(2).replace(/\.00$/, '') + ' GB';
}

function formatDateTime(value) {
  if (!value) return '';
  const dt = new Date(value);
  if (Number.isNaN(dt.getTime())) return '';
  return dt.toLocaleString();
}

function titleCaseToken(token) {
  return String(token || '')
    .split(/[_-]+/)
    .filter(Boolean)
    .map(part => part.charAt(0).toUpperCase() + part.slice(1))
    .join(' ');
}

function routeTypeLabel(routeType, plural = true) {
  const normalized = String(routeType || 'request');
  if (normalized === 'request') return plural ? 'Requests' : 'Request';
  if (normalized === 'view') return plural ? 'Views' : 'View';
  if (normalized === 'reducer') return plural ? 'Reducers' : 'Reducer';
  const label = titleCaseToken(normalized);
  return plural ? label + ' Events' : label + ' Event';
}

// ── Toast ──
let _toastSet = null;
let _toastId = 0;
function showToast(message, type = 'success') {
  if (_toastSet) _toastSet(prev => [...prev, { id: ++_toastId, message, type }]);
}

function Toasts() {
  const [items, setItems] = useState([]);
  _toastSet = setItems;
  useEffect(() => {
    if (items.length === 0) return;
    const t = setTimeout(() => setItems(prev => prev.slice(1)), 2500);
    return () => clearTimeout(t);
  }, [items]);
  if (items.length === 0) return null;
  return html`<div class="toast-container" role="status" aria-live="polite">
    ${items.map(t => html`<div key=${t.id} class=${"toast toast-" + t.type}>${t.type === "error" ? icons.help : icons.check}<span>${t.message}</span></div>`)}
  </div>`;
}

function valueToEditorInput(field, value) {
  if (value == null) return '';
  if (!field) return String(value);
  if (field.type === 'boolean') return value ? 'true' : 'false';
  if (['json', 'vector', 'roles', 'set', 'refMulti', 'fileMulti'].includes(field.type)) {
    try { return JSON.stringify(value); } catch { return String(value); }
  }
  return String(value);
}

function parseEditorInput(field, input) {
  if (!field) return input;
  if (field.type === 'number' || field.type === 'integer' || field.type === 'timestamp') {
    return input === '' ? null : Number(input);
  }
  if (field.type === 'boolean') return input === '' ? null : input === 'true';
  if (['json', 'vector', 'roles', 'set', 'refMulti', 'fileMulti'].includes(field.type)) {
    try { return JSON.parse(input); } catch { return input; }
  }
  return input;
}

function RowEditor({ mode = 'edit', tableName, schema, cols, row, createError, onClose, onSave, onCreate, onReload, readOnly = false }) {
  const isCreate = mode === 'create';
  const pkField = cols[0];
  const pk = row ? row[pkField] : '';
  const editorCols = useMemo(() => {
    const priority = ['title', 'name', 'email', 'slug', 'excerpt', 'description', 'body'];
    const rank = col => isAutoField(schema, col) || isReadOnly(schema, col)
      ? 100 : priority.includes(col.toLowerCase()) ? priority.indexOf(col.toLowerCase()) : priority.length;
    return [...cols].sort((a,b) => rank(a) - rank(b));
  }, [cols, schema]);
  const [form, setForm] = useState({});
  const [pendingFiles, setPendingFiles] = useState({});
  const [refOptions, setRefOptions] = useState({});
  const [saving, setSaving] = useState(false);
  const [uploadingCol, setUploadingCol] = useState('');
  const editorRef = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const previous = document.activeElement;
    const editor = editorRef.current;
    editor.querySelector('button').focus();
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); closeRef.current(); }
      if (e.key !== 'Tab' || !window.matchMedia('(max-width:760px), (max-height:500px) and (max-width:1100px)').matches) return;
      const items = [...editor.querySelectorAll('button,input,select,textarea,a')].filter(el => !el.disabled && el.getClientRects().length);
      if (e.shiftKey && document.activeElement === items[0]) { e.preventDefault(); items[items.length - 1].focus(); }
      if (!e.shiftKey && document.activeElement === items[items.length - 1]) { e.preventDefault(); items[0].focus(); }
    };
    editor.addEventListener('keydown', onKey);
    return () => { editor.removeEventListener('keydown', onKey); if (previous?.isConnected) previous.focus(); };
  }, [pk, isCreate]);

  // Initialize only when the record changes; live refreshes must not erase a draft.
  useLayoutEffect(() => {
    if (!schema) return;
    const next = {};
    for (const col of cols) {
      next[col] = isCreate ? '' : valueToEditorInput(schema[col], row ? row[col] : null);
    }
    setForm(next);
    setPendingFiles({});
  }, [tableName, pk, isCreate, !!schema]);

  useEffect(() => {
    if (!schema) return;
    const refs = Object.entries(schema)
      .filter(([, f]) => f && (f.type === 'ref' || f.type === 'refMulti') && f.refTable)
      .map(([col, f]) => ({ col, table: f.refTable }));
    let alive = true;
    Promise.all(refs.map(r => fetchRefOptions(r.table))).then(all => {
      if (!alive) return;
      const map = {};
      refs.forEach((r, i) => { map[r.col] = all[i]; });
      setRefOptions(map);
    });
    return () => { alive = false; };
  }, [schema]);

  const setCol = useCallback((col, value) => {
    setForm(prev => ({ ...prev, [col]: value }));
  }, []);

  const doSave = useCallback(async () => {
    if (!schema) return;

    if (isCreate) {
      const data = {};
      for (const col of cols) {
        if (isAutoField(schema, col)) continue;
        const f = schema[col];
        if (f && f.cached) continue;
        if (f && (f.type === 'fileSingle' || f.type === 'fileMulti')) continue;
        const raw = form[col] ?? '';
        if (raw === '') continue;
        data[col] = parseEditorInput(f, raw);
      }
      setSaving(true);
      try {
        await onCreate(data, pendingFiles);
      } catch (err) {
        // Errors are handled by submitCreate (toast + inline message).
      } finally {
        setSaving(false);
      }
      return;
    }

    if (!row) return;
    const payload = {};
    for (const col of cols) {
      if (isAutoField(schema, col) || isReadOnly(schema, col)) continue;
      const f = schema[col];
      if (f && (f.type === 'fileSingle' || f.type === 'fileMulti')) continue;
      const before = valueToEditorInput(f, row[col]);
      const after = form[col] ?? '';
      if (before !== after) payload[col] = parseEditorInput(f, after);
    }
    if (Object.keys(payload).length === 0) {
      showToast('No changes');
      return;
    }
    setSaving(true);
    try {
      await onSave(String(pk), payload);
    } catch (err) {
      showToast(err.message || 'Update failed', 'error');
    } finally {
      setSaving(false);
    }
  }, [schema, row, cols, form, pk, onSave, isCreate, onCreate, pendingFiles]);

  const onUploadFile = useCallback(async (col, e) => {
    if (readOnly) return;
    const field = schema ? schema[col] : null;
    const files = Array.from(e.target.files || []);
    if (isCreate) {
      if (field && field.type === 'fileMulti') {
        if (files.length === 0) return;
        setPendingFiles(prev => ({
          ...prev,
          [col]: [...normalizeFileItems(prev[col]), ...files]
        }));
      } else {
        const f = files[0];
        if (!f) return;
        setPendingFiles(prev => ({ ...prev, [col]: f }));
        setCol(col, f.name);
      }
      if (e.target) e.target.value = '';
      return;
    }
    const f = files[0];
    if (!f) return;
    setUploadingCol(col);
    try {
      const res = await apiUpload('/tables/' + tableName + '/rows/' + pk + '/files/' + col, f);
      if (res && res.error) showToast(res.error, 'error');
      else showToast('File uploaded');
      await onReload();
    } catch (err) {
      showToast(err.message || 'Upload failed', 'error');
    } finally {
      setUploadingCol('');
      if (e.target) e.target.value = '';
    }
  }, [tableName, pk, onReload, isCreate, setCol, readOnly, schema]);

  const onRemoveFile = useCallback(async (col, fileKey = '', pendingIndex = -1) => {
    if (readOnly) return;
    const field = schema ? schema[col] : null;
    if (isCreate) {
      if (field && field.type === 'fileMulti' && pendingIndex >= 0) {
        setPendingFiles(prev => {
          const next = { ...prev };
          next[col] = normalizeFileItems(prev[col]).filter((_, idx) => idx !== pendingIndex);
          if (next[col].length === 0) delete next[col];
          return next;
        });
      } else {
        setPendingFiles(prev => {
          const next = { ...prev };
          delete next[col];
          return next;
        });
        setCol(col, '');
      }
      return;
    }
    try {
      const suffix = fileKey ? ('?path=' + encodeURIComponent(fileKey)) : '';
      await apiDelete('/tables/' + tableName + '/rows/' + pk + '/files/' + col + suffix);
      showToast('File removed');
      await onReload();
    } catch (err) {
      showToast(err.message || 'Remove failed', 'error');
    }
  }, [tableName, pk, onReload, isCreate, setCol, readOnly, schema]);

  const isMetadata = col => !readOnly && (isAutoField(schema,col) || (isCreate ? schema?.[col]?.cached === true : isReadOnly(schema,col) || row?.[col] === '[REDACTED]'));
  const editableCols = editorCols.filter(col => !isMetadata(col));
  const metadataCols = editorCols.filter(isMetadata);
  const renderField = col => {
          const field = schema ? schema[col] : null;
          const val = row ? row[col] : null;
          const ro = readOnly || (isCreate
            ? (isAutoField(schema, col) || (field && field.cached === true))
            : (isAutoField(schema, col) || isReadOnly(schema, col) || val === '[REDACTED]'));
          const typeLabel = field ? field.type + (field.refTable ? ' -> ' + field.refTable : '') : '';
          const inputVal = form[col] ?? '';

          if (field && (field.type === 'fileSingle' || field.type === 'fileMulti')) {
            const accept = field.mimeTypes ? field.mimeTypes.join(',') : '';
            const singleFile = isCreate ? pendingFiles[col] : (field.type === 'fileSingle' ? val : null);
            const multiFiles = field.type === 'fileMulti'
              ? (isCreate ? normalizeFileItems(pendingFiles[col]) : normalizeFileItems(val))
              : [];
            const fileCount = field.type === 'fileMulti' ? multiFiles.length : (singleFile ? 1 : 0);
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <div class="row-editor-readonly">
                ${field.type === 'fileSingle' ? (singleFile && fileDisplayName(singleFile) ? fileDisplayName(singleFile) : html`<span class="null">null</span>`) : (fileCount > 0 ? fileCount + ' files' : html`<span class="null">null</span>`)}
              </div>
              ${field.type === 'fileMulti' && html`
                <div class="file-list">
                  ${multiFiles.length > 0 ? multiFiles.map((file, idx) => {
                    const fileName = fileDisplayName(file) || ('file ' + (idx + 1));
                    const itemKey = file.path || file.url || fileName + ':' + idx;
                    return html`<div key=${itemKey} class="file-item">
                      <span class="file-item-main">
                        ${isImageFile(file) && file.url ? html`<img class="file-thumb" src=${file.url} alt=${fileName} />` : ''}
                        ${file.url
                          ? html`<a href=${file.url} target="_blank" class="file-link file-item-name" onClick=${e => e.stopPropagation()}>${fileName}</a>`
                          : html`<span class="file-item-name">${fileName}</span>`
                        }
                      </span>
                      ${!readOnly && html`<button class="btn btn-sm file-remove" onClick=${() => onRemoveFile(col, isCreate ? fileName : (file.path || ''), isCreate ? idx : -1)}>${icons.trash} Remove</button>`}
                    </div>`;
                  }) : html`<span class="null">null</span>`}
                </div>
              `}
              <div class="create-actions" style="margin-top:6px">
                ${!readOnly && html`
                <label class="btn btn-sm btn-primary file-upload-btn">
                  ${uploadingCol === col ? 'Uploading...' : html`${icons.upload} Upload`}
                  <input aria-label=${col} type="file" accept=${accept} multiple=${field.type === 'fileMulti'} onChange=${e => onUploadFile(col, e)} hidden />
                </label>
                ${field.type === 'fileSingle' && fileCount > 0 && html`<button class="btn btn-sm file-remove" onClick=${() => onRemoveFile(col)}>${icons.trash} Remove</button>`}
                `}
              </div>
            </div>`;
          }

          if (ro) {
            const display = isCreate
              ? html`<span class="null">auto</span>`
              : (val == null ? html`<span class="null">null</span>` : (typeof val === 'object' ? JSON.stringify(val) : String(val)));
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}${typeLabel ? ' ' : ''}(read only)</span></label>
              <div class="row-editor-readonly">${display}</div>
            </div>`;
          }

          if (field && field.type === 'bcrypt') {
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <input aria-label=${col} type="password" value=${inputVal} onInput=${e => setCol(col, e.target.value)} />
            </div>`;
          }

          if (field && field.type === 'boolean') {
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <select aria-label=${col} value=${inputVal} disabled=${readOnly} onChange=${e => setCol(col, e.target.value)}>
                <option value="">null</option>
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </div>`;
          }

          if (field && field.type === 'enum' && field.enumValues) {
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <select aria-label=${col} value=${inputVal} disabled=${readOnly} onChange=${e => setCol(col, e.target.value)}>
                <option value="">--</option>
                ${field.enumValues.map(v => html`<option key=${v} value=${v}>${v}</option>`)}
              </select>
            </div>`;
          }

          if (field && field.type === 'ref' && field.refTable) {
            const options = refOptions[col] || [];
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <select aria-label=${col} value=${inputVal} onChange=${e => setCol(col, e.target.value)}>
                <option value="">--</option>
                ${options.map(o => html`<option key=${o.id} value=${o.id}>${o.id}${o.label !== o.id ? ' - ' + o.label : ''}</option>`)}
              </select>
            </div>`;
          }

          if (field && (['json', 'vector', 'roles', 'set', 'refMulti'].includes(field.type) || (field.type === 'string' && (/^(body|description|content|excerpt)$/i.test(col) || String(row?.[col] || '').length > 120)))) {
            return html`<div key=${col} class="row-editor-field">
              <label>${col} <span class="type-badge">${typeLabel}</span></label>
              <textarea aria-label=${col} value=${inputVal} disabled=${readOnly} onInput=${e => setCol(col, e.target.value)}></textarea>
            </div>`;
          }

          const inputType = field && (field.type === 'number' || field.type === 'integer' || field.type === 'timestamp') ? 'number' : 'text';
          return html`<div key=${col} class="row-editor-field">
            <label>${col} <span class="type-badge">${typeLabel}</span></label>
            <input aria-label=${col} type=${inputType} value=${inputVal} disabled=${readOnly} onInput=${e => setCol(col, e.target.value)} />
          </div>`;
          };

  return html`
    <aside class="row-editor" ref=${editorRef} aria-label=${isCreate ? "Create record" : "Record details"}>
      <div class="row-editor-header">
        <div>
          <div class="row-editor-title">${isCreate ? 'New record' : readOnly ? 'Record details' : 'Edit record'}</div>
          <div class="row-editor-meta">${tableName} / ${isCreate ? 'Create' : String(pk)}</div>
        </div>
        <button class="btn-icon" aria-label="Close record" onClick=${onClose}>${icons.chevLeft}</button>
      </div>
      <div class="row-editor-body">
        ${editableCols.map(renderField)}
        ${!isCreate && metadataCols.length > 0 && html`<details class="record-metadata"><summary>Record metadata · ${metadataCols.length} fields</summary>${metadataCols.map(renderField)}</details>`}
      </div>
      <div class="row-editor-actions">
        ${isCreate && createError && html`<span class="create-error" style="margin-right:auto">${createError}</span>`}
        <button class="btn" onClick=${onClose}>Close</button>
        ${!readOnly && html`<button class="btn btn-primary" disabled=${saving} onClick=${doSave}>${isCreate ? (saving ? 'Creating...' : 'Create record') : (saving ? 'Saving...' : 'Save changes')}</button>`}
      </div>
    </aside>
  `;
}

function DataTable({ tableName, tableMeta, schema, archive = false, onReload, sseSignal }) {
  const [rows, setRows] = useState([]);
  const [page, setPage] = useState(1);
  const [totalPages, setTotalPages] = useState(1);
  const [total, setTotal] = useState(0);
  const [selectedPk, setSelectedPk] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [createErr, setCreateErr] = useState('');
  const [search, setSearch] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [refreshingMaterialized, setRefreshingMaterialized] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState('');
  const [filterHelp, setFilterHelp] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  useEffect(() => { if (searchOpen) document.querySelector('.record-search input')?.focus(); }, [searchOpen]);
  const [presentation, setPresentation] = useState(() => window.matchMedia('(max-width:760px), (max-height:500px) and (max-width:1100px)').matches ? 'records' : 'table');
  const requestId = useRef(0);
  const listScroll = useRef(0);
  const restoreFrame = useRef(0);
  useEffect(() => () => cancelAnimationFrame(restoreFrame.current), []);
  const openEditor = pk => {
    listScroll.current = document.getElementById('app').scrollTop;
    setCreateErr('');
    setShowCreate(pk == null);
    setSelectedPk(pk == null ? null : String(pk));
  };
  const closeEditor = () => {
    setShowCreate(false);
    setSelectedPk(null);
    setCreateErr('');
    restoreFrame.current = requestAnimationFrame(() => { document.getElementById('app').scrollTop = listScroll.current; });
  };

  const isMaterialized = !!tableMeta?.materialized;
  const isReadOnlyTable = !!tableMeta?.readOnly || archive;
  const rowsBasePath = archive ? ('/archive/tables/' + tableName + '/rows') : ('/tables/' + tableName + '/rows');

  const cols = useMemo(() => schema ? Object.keys(schema) : (rows.length > 0 ? Object.keys(rows[0]) : []), [schema, rows]);

  const previewCols = useMemo(() => {
    const preferred = ['title', 'name', 'email', 'status', 'slug', 'description', 'body'];
    const available = cols.filter(c => c !== cols[0] && !['bcrypt', 'ref', 'refMulti', 'fileSingle', 'fileMulti'].includes(schema?.[c]?.type));
    const ordered = [...available].sort((a,b) => {
      const rank = c => preferred.includes(c.toLowerCase()) ? preferred.indexOf(c.toLowerCase()) : preferred.length;
      return rank(a) - rank(b);
    });
    return ordered.length ? ordered.slice(0, 3) : cols.slice(0, 1);
  }, [cols, schema]);

  const displayCols = useMemo(() => [...previewCols, ...cols.filter(c => !previewCols.includes(c))], [cols, previewCols]);

  const loadRows = useCallback(async (p, q) => {
    const request = ++requestId.current;
    setLoading(true);
    setLoadError('');
    const pg = p || page;
    const sq = q !== undefined ? q : searchQuery;
    const params = new URLSearchParams({ limit: 50 });
    if (archive) params.set('offset', String((pg - 1) * 50));
    else params.set('page', pg);
    if (sq && !archive) {
      const isFilter = /[=<>~]|!=|!~/.test(sq);
      params.set(isFilter ? 'filter' : 'search', sq);
    }
    try {
      const data = await api(rowsBasePath + '?' + params);
      if (data && request === requestId.current) {
        setRows(data.rows || []);
        setTotalPages(data.pages || Math.max(1, Math.ceil((data.total || 0) / 50)));
        setTotal(data.total);
      }
    } catch (err) {
      if (request === requestId.current) setLoadError(err.message || 'Unable to load rows');
    } finally { if (request === requestId.current) setLoading(false); }
  }, [tableName, page, searchQuery, archive, rowsBasePath]);

  useEffect(() => {
    setPage(1);
    setSearch('');
    setSearchQuery('');
    setShowCreate(false);
    setCreateErr('');
    setSelectedPk(null);
  }, [tableName]);

  useEffect(() => { loadRows(page, searchQuery); }, [tableName, page, searchQuery]);

  // Debounced reload when SSE signals changes for this table
  const sseReloadTimer = useRef(null);
  useEffect(() => {
    if (!sseSignal) return;
    clearTimeout(sseReloadTimer.current);
    sseReloadTimer.current = setTimeout(() => loadRows(), 500);
    return () => clearTimeout(sseReloadTimer.current);
  }, [sseSignal]);

  const applyFilter = useCallback(() => {
    setSearchQuery(search);
    setPage(1);
  }, [search]);

  const onSearchInput = useCallback((e) => {
    setSearch(e.target.value);
  }, []);

  const onSearchKey = useCallback((e) => {
    if (e.key === 'Enter') { e.preventDefault(); applyFilter(); }
  }, [applyFilter]);

  const saveRow = useCallback(async (pk, payload) => {
    await api('/tables/' + tableName + '/rows/' + pk, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });
    showToast('Row updated');
    loadRows();
  }, [tableName, loadRows]);

  const deleteRow = useCallback(async (pk) => {
    if (!confirm('Delete row ' + pk + '?')) return;
    try {
      await api('/tables/' + tableName + '/rows/' + pk, { method: 'DELETE' });
      showToast('Row deleted');
    } catch(err) {
      showToast(err.message || 'Delete failed', 'error');
    }
    if (selectedPk != null && String(selectedPk) === String(pk)) setSelectedPk(null);
    loadRows();
  }, [tableName, loadRows, selectedPk]);

  const archiveRow = useCallback(async (pk) => {
    if (!confirm('Archive row ' + pk + '?')) return;
    try {
      await api('/tables/' + tableName + '/rows/' + pk + '/archive', { method: 'POST' });
      showToast('Row archived');
    } catch (err) {
      showToast(err.message || 'Archive failed', 'error');
    }
    if (selectedPk != null && String(selectedPk) === String(pk)) setSelectedPk(null);
    loadRows();
    onReload?.();
  }, [tableName, loadRows, selectedPk, onReload]);

  const restoreRow = useCallback(async (archiveID) => {
    if (!confirm('Restore archived row ' + archiveID + '?')) return;
    try {
      await api('/archive/tables/' + tableName + '/rows/' + archiveID + '/restore', { method: 'POST' });
      showToast('Archived row restored');
    } catch (err) {
      showToast(err.message || 'Restore failed', 'error');
    }
    if (selectedPk != null && String(selectedPk) === String(archiveID)) setSelectedPk(null);
    loadRows();
    onReload?.();
  }, [tableName, selectedPk, loadRows, onReload]);

  const deleteArchivedRow = useCallback(async (archiveID) => {
    if (!confirm('Permanently delete archived row ' + archiveID + '?')) return;
    try {
      await api('/archive/tables/' + tableName + '/rows/' + archiveID, { method: 'DELETE' });
      showToast('Archived row deleted');
    } catch (err) {
      showToast(err.message || 'Delete failed', 'error');
    }
    if (selectedPk != null && String(selectedPk) === String(archiveID)) setSelectedPk(null);
    loadRows();
    onReload?.();
  }, [tableName, selectedPk, loadRows, onReload]);

  const refreshMaterialized = useCallback(async () => {
    if (!isMaterialized || refreshingMaterialized) return;
    setRefreshingMaterialized(true);
    try {
      await api('/materialized/' + tableName + '/refresh', { method: 'POST' });
      showToast('Materialized table refreshed');
      onReload?.();
      loadRows();
    } catch (err) {
      showToast(err.message || 'Refresh failed', 'error');
    } finally {
      setRefreshingMaterialized(false);
    }
  }, [isMaterialized, refreshingMaterialized, tableName, onReload, loadRows]);

  const submitCreate = useCallback(async (data, pendingFiles) => {
    if (!schema) return;
    setCreateErr('');
    try {
      const res = await api('/tables/' + tableName + '/rows', { method: 'POST', body: JSON.stringify(data) });
      // Upload pending files using the new row's primary key
      if (res && res.row) {
        const pk = res.row[Object.keys(schema)[0]];
        for (const [col, value] of Object.entries(pendingFiles)) {
          const files = Array.isArray(value) ? value : [value];
          for (const file of files) {
            if (!file) continue;
            const upRes = await apiUpload('/tables/' + tableName + '/rows/' + pk + '/files/' + col, file);
            if (upRes && upRes.error) showToast(col + ': ' + upRes.error, 'error');
          }
        }
      }
      setShowCreate(false);
      setCreateErr('');
      showToast('Row created');
      loadRows();
    } catch(err) {
      showToast(err.message || 'Create failed', 'error');
      setCreateErr(err.message || 'Create failed');
      throw err;
    }
  }, [schema, tableName, loadRows]);

  const selectedRow = useMemo(() => {
    if (selectedPk == null) return null;
    return rows.find(r => String(r[cols[0]]) === String(selectedPk)) || null;
  }, [rows, cols, selectedPk]);

  return html`
    <div class=${"panel data-workspace " + (showCreate || selectedRow ? "editing" : "")} >
      <div class="panel-toolbar data-toolbar"><div class="data-heading">
        <div class="panel-title">
          <span class="panel-title-icon">${icons.table}</span>
          <div class="collection-title"><div class="collection-title-line"><h1>${tableName}</h1><span class="panel-meta">${total} rows</span></div></div>
          ${isMaterialized && html`<span class="materialized-badge">materialized</span>`}
          ${isMaterialized && Number(tableMeta?.lastRefreshUnixMilli) > 0 ? html`<span class="panel-meta">refreshed ${fmtAgo(tableMeta.lastRefreshUnixMilli)} (${fmtTime(tableMeta.lastRefreshUnixMilli)})</span>` : ""}
        </div>
          ${!archive && html`<button class="btn-icon mobile-search-toggle" aria-label="Search records" aria-expanded=${searchOpen} onClick=${() => setSearchOpen(v => !v)}>${icons.search}</button>`}
          ${!isReadOnlyTable && html`<button class="btn btn-primary" disabled=${!schema} onClick=${() => openEditor(null)}>
            ${icons.plus} New record
          </button>`}
        </div><div class=${"panel-actions record-search "+(searchOpen ? "search-open" : "")}>
          ${!archive && html`<div class="search-box">
            ${icons.search}
            <input type="text" aria-label="Search or filter rows" placeholder="Search or filter rows…" value=${search} disabled=${archive} onInput=${onSearchInput} onKeyDown=${onSearchKey} />
            <button class="btn-filter" aria-label="Apply filter" onClick=${applyFilter}>${icons.chevRight}</button>
          </div>`}
          ${!archive && html`<button class="btn-icon" aria-label="Filter help" aria-expanded=${filterHelp} onClick=${() => setFilterHelp(v => !v)}>${icons.help}</button>`}

        </div>
      </div>

      ${filterHelp && html`<div class="filter-guide">Search all text fields, or use a filter: <code>name="Alice"</code>, <code>count>=5</code>, <code>name~"ali"</code>. Combine with <code>&&</code> (and) or <code>||</code> (or).</div>`}
      <div class="data-viewbar"><div class="view-tabs" aria-label="Collection view">${[['records','Records'],['table','Table'],['schema','Structure']].map(([id,label]) => html`<button aria-pressed=${presentation === id} onClick=${() => setPresentation(id)}>${label}</button>`)}</div><span>${archive ? 'Archived · ' : isReadOnlyTable ? 'Read only · ' : ''}${cols.length} fields</span></div>
      ${searchQuery && html`<div class="active-filter"><span>Filtered: <strong>${searchQuery}</strong></span><button class="btn" onClick=${() => { setSearch(''); setSearchQuery(''); setPage(1); }}>Clear filter</button></div>`}
      ${presentation === 'table' && html`<div class="table-scroll-hint">Swipe horizontally to see all ${cols.length} fields</div>`}
      ${presentation === 'schema' && html`<div class="schema-view"><div class="section-heading"><h2>Collection structure</h2><p>Fields and relationships defined by your application.</p></div>${cols.map(c => html`<div class="schema-field"><strong>${c}</strong><code>${schema?.[c]?.type || 'unknown'}</code><span>${schema?.[c]?.refTable ? '→ '+schema[c].refTable : isAutoField(schema,c) ? 'Generated automatically' : isReadOnly(schema,c) ? 'Read only' : 'Editable'}</span></div>`)}</div>`}
      ${isMaterialized && html`<div class=${"materialized-banner" + (tableMeta?.refreshError ? ' error' : '')}>
        <div>
          <strong>Materialized table</strong>
          <div class="panel-meta">${tableMeta?.refreshError ? 'Last refresh failed' : (tableMeta?.lastRefreshUnixMilli ? 'Last refreshed ' + fmtAgo(tableMeta.lastRefreshUnixMilli) : 'Not refreshed yet')}</div>
          ${tableMeta?.refreshError ? html`<div class="panel-meta" style="color:var(--danger-hover-text)">${tableMeta.refreshError}</div>` : ''}
        </div>
        <button class="btn" disabled=${refreshingMaterialized} onClick=${refreshMaterialized}>${icons.refresh} ${refreshingMaterialized ? 'Refreshing...' : 'Refresh now'}</button>
      </div>`}

      <div class=${"table-layout presentation-"+presentation} aria-busy=${loading}>
        <div class="table-container" tabindex=${presentation === "table" ? "0" : undefined} aria-label=${presentation === "table" ? "Record table, scroll horizontally for more fields" : undefined}>
          <table class=${"records-table " + (presentation === "records" ? "record-list" : "")}>
            <thead>
              <tr>
                ${displayCols.map(c => {
                  const f = schema ? schema[c] : null;
                  const typeStr = f ? f.type + (f.refTable ? ' -> ' + f.refTable : '') + (f.cached ? ' (cached)' : '') : '';
                  return html`<th key=${c}>
                    <span class="th-name">${c}</span>
                    ${typeStr && html`<span class="th-type">${typeStr}</span>`}
                  </th>`;
                })}
                <th class="th-actions"></th>
              </tr>
            </thead>
            <tbody>
              ${(loading || loadError || rows.length === 0) && html`
                <tr><td colspan=${cols.length + 1} class="empty-row" role=${loadError ? 'alert' : 'status'}>
                  ${loading ? 'Loading records…' : loadError || (searchQuery ? 'No records match this filter.' : 'This table has no records yet.')}
                  ${loadError && html`<br/><button class="btn" onClick=${() => loadRows()}>Try again</button>`}
                </td></tr>
              `}
              ${!loadError && rows.map(row => {
                const pk = row[cols[0]];
                const isSelected = selectedPk != null && String(selectedPk) === String(pk);
                return html`
                  <tr key=${pk} class=${isSelected ? 'selected' : ''} tabindex="0" aria-label=${'Open ' + tableName + ' record ' + String(row[previewCols[0]] ?? pk)} onKeyDown=${e => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openEditor(pk); } }} onClick=${() => { openEditor(pk); }}>
                    ${displayCols.map(c => {
                      const val = row[c];
                      const ro = isReadOnly(schema, c) || isAutoField(schema, c) || val === '[REDACTED]';
                      const f = schema ? schema[c] : null;
                      const isFile = f && (f.type === 'fileSingle' || f.type === 'fileMulti');
                      const isObj = typeof val === 'object' && val !== null;
                      let display;
                      if (isFile && f.type === 'fileSingle' && val && val.url) {
                        const isImage = val.mime && val.mime.startsWith('image/');
                        const fileName = fileDisplayName(val) || 'file';
                        display = html`<span class="file-display">${isImage ? html`<img class="file-thumb" src=${val.url} alt=${fileName} />` : ''}<a href=${val.url} target="_blank" class="file-link" onClick=${e => e.stopPropagation()}>${fileName}</a></span>`;
                      } else if (isFile && f.type === 'fileMulti' && Array.isArray(val) && val.length > 0) {
                        display = val.length + ' file' + (val.length !== 1 ? 's' : '');
                      } else if (isFile) {
                        display = null;
                      } else {
                        display = isObj ? JSON.stringify(val) : val;
                      }
                      const rendered = display == null
                        ? html`<span class="null">null</span>`
                        : (typeof display === 'object' ? display : truncate(String(display)));
                      return html`<td key=${c} data-label=${c} style=${previewCols.includes(c) ? {order: previewCols.indexOf(c)} : {}} class=${(ro ? "td-readonly " : "") + (previewCols.includes(c) ? "mobile-preview " : "") + (previewCols[0] === c ? "mobile-primary" : "")}>${rendered}</td>`;
                    })}
                    <td class="td-actions">
                      ${archive
                        ? html`
                            <button class="btn-icon" onClick=${(e) => { e.stopPropagation(); restoreRow(pk); }} title="Restore">${icons.restore}</button>
                            <button class="btn-icon danger" onClick=${(e) => { e.stopPropagation(); deleteArchivedRow(pk); }} title="Delete Permanently">${icons.trash}</button>
                          `
                        : html`
                            <button class="btn-icon" disabled=${isReadOnlyTable} onClick=${(e) => { e.stopPropagation(); archiveRow(pk); }} title="Archive">${icons.archive}</button>
                            <button class="btn-icon danger" disabled=${isReadOnlyTable} onClick=${(e) => { e.stopPropagation(); deleteRow(pk); }} title="Delete">${icons.trash}</button>
                          `
                      }
                    </td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
        </div>
        ${showCreate && html`<${RowEditor}
          mode="create"
          tableName=${tableName}
          schema=${schema}
          cols=${cols}
          createError=${createErr}
          onClose=${closeEditor}
          onCreate=${submitCreate}
          onReload=${loadRows}
        />`}
        ${!showCreate && selectedRow && html`<${RowEditor}
          tableName=${tableName}
          schema=${schema}
          cols=${cols}
          row=${selectedRow}
          readOnly=${isReadOnlyTable}
          onClose=${closeEditor}
          onSave=${saveRow}
          onReload=${loadRows}
        />`}
      </div>

      <div class="pagination">
          <span class="page-info">${total.toLocaleString()} records</span>

          <span class="page-info">Page ${page} of ${totalPages}</span>
          <button class="btn-icon" aria-label="Next page" disabled=${loading || page >= totalPages} onClick=${() => setPage(p => p + 1)}>${icons.chevRight}</button>
          </div>
        </div>
    </div>
  `;
}

function fmtCount(n) {
  return (Number(n) || 0).toLocaleString();
}

function fmtMs(n) {
  const v = Number(n) || 0;
  if (v >= 1000) return (v / 1000).toFixed(2) + 's';
  return v.toFixed(2) + 'ms';
}

function fmtPct(n) {
  return (Number(n) || 0).toFixed(2) + '%';
}

function fmtBytes(n) {
  const v = Number(n) || 0;
  if (v < 1024) return v.toFixed(0) + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let x = v / 1024;
  let i = 0;
  while (x >= 1024 && i < units.length - 1) {
    x /= 1024;
    i++;
  }
  return x.toFixed(2) + ' ' + units[i];
}

function fmtTime(ts) {
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return '-';
  return new Date(n).toLocaleString();
}

function fmtAgo(ts) {
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return '';
  const diff = Math.max(0, Date.now() - n);
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return sec + 's ago';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  const day = Math.floor(hr / 24);
  return day + 'd ago';
}

function downsamplePoints(points, maxPoints = 360) {
  if (!Array.isArray(points) || points.length <= maxPoints) return points || [];
  const out = [];
  const step = (points.length - 1) / (maxPoints - 1);
  for (let i = 0; i < maxPoints; i++) {
    out.push(points[Math.floor(i * step)]);
  }
  return out;
}

function AnalyticsChart({ points }) {
  const data = useMemo(() => downsamplePoints(points, 360), [points]);
  const boxRef = useRef(null);
  const [hover, setHover] = useState(null); // { xSvg, xPx, widthPx }
  if (!data || data.length === 0) {
    return html`<div class="analytics-empty">No metrics in selected window</div>`;
  }

  const width = 1000;
  const height = 220;
  const padX = 0;
  const padY = 16;
  const innerW = width - padX * 2;
  const innerH = height - padY * 2;

  const maxCount = Math.max(1, ...data.map(p => Number(p.count) || 0));
  const maxAvg = Math.max(1, ...data.map(p => Number(p.avgMs) || 0));

  const countPts = [];
  const avgPts = [];
  for (let i = 0; i < data.length; i++) {
    const x = padX + (i / Math.max(1, data.length - 1)) * innerW;
    const yCount = padY + innerH - ((Number(data[i].count) || 0) / maxCount) * innerH;
    const yAvg = padY + innerH - ((Number(data[i].avgMs) || 0) / maxAvg) * innerH;
    countPts.push(`${x.toFixed(2)},${yCount.toFixed(2)}`);
    avgPts.push(`${x.toFixed(2)},${yAvg.toFixed(2)}`);
  }

  const onMove = useCallback((e) => {
    if (!boxRef.current || data.length === 0) return;
    const rect = boxRef.current.getBoundingClientRect();
    if (rect.width <= 0) return;
    const localX = Math.min(Math.max(0, e.clientX - rect.left), rect.width);
    const xSvg = (localX / rect.width) * width;
    setHover((prev) => {
      if (prev && Math.abs(prev.xPx - localX) < 0.5) return prev;
      return { xSvg, xPx: localX, widthPx: rect.width };
    });
  }, [data]);

  const onLeave = useCallback(() => setHover(null), []);

  let hoverMeta = null;
  if (hover && data.length > 0) {
    const n = Math.max(1, data.length - 1);
    const xPlot = Math.min(Math.max(0, hover.xSvg), width);
    const t = innerW > 0 ? (xPlot - padX) / innerW : 0;
    const raw = t * n;
    const left = Math.floor(raw);
    const right = Math.min(data.length - 1, left + 1);
    const frac = raw - left;
    const idx = Math.min(Math.max(0, Math.round(raw)), data.length - 1);
    const p = data[idx] || {};
    const pl = data[left] || p;
    const pr = data[right] || p;
    const count = Number(p.count) || 0;
    const errors = Number(p.errorCount) || 0;
    const avg = Number(p.avgMs) || 0;
    const p95 = Number(p.p95Ms) || 0;
    const countInterp = (Number(pl.count) || 0) + ((Number(pr.count) || 0) - (Number(pl.count) || 0)) * frac;
    const avgInterp = (Number(pl.avgMs) || 0) + ((Number(pr.avgMs) || 0) - (Number(pl.avgMs) || 0)) * frac;
    const countY = padY + innerH - (countInterp / maxCount) * innerH;
    const avgY = padY + innerH - (avgInterp / maxAvg) * innerH;
    const tooltipLeft = Math.min(Math.max(8, hover.xPx + 12), Math.max(8, hover.widthPx - 228));
    hoverMeta = { idx, xSvg: xPlot, count, errors, avg, p95, ts: p.ts, countY, avgY, tooltipLeft };
  }

  return html`
    <div class="analytics-chart-box" ref=${boxRef} onMouseMove=${onMove} onMouseLeave=${onLeave}>
      <svg class="analytics-chart" viewBox=${`0 0 ${width} ${height}`} preserveAspectRatio="none">
        <line x1=${padX} y1=${height - padY} x2=${width - padX} y2=${height - padY} stroke="var(--border)" stroke-width="1" />
        <line x1=${padX} y1=${padY} x2=${padX} y2=${height - padY} stroke="var(--border)" stroke-width="1" />
        <polyline fill="none" stroke="var(--accent)" stroke-width="2" points=${countPts.join(' ')} />
        <polyline fill="none" stroke="var(--error)" stroke-width="2" points=${avgPts.join(' ')} />
        ${hoverMeta && html`
          <line x1=${hoverMeta.xSvg} y1=${padY} x2=${hoverMeta.xSvg} y2=${height - padY} stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="3 3" />
          <circle cx=${hoverMeta.xSvg} cy=${hoverMeta.countY} r="3.5" fill="var(--accent)" />
          <circle cx=${hoverMeta.xSvg} cy=${hoverMeta.avgY} r="3.5" fill="var(--error)" />
        `}
      </svg>
      ${hoverMeta && html`
        <div class="analytics-tooltip" style=${`left:${hoverMeta.tooltipLeft}px;top:8px;`}>
          <div class="tooltip-time">${fmtTime(hoverMeta.ts)}</div>
          <div class="tooltip-row"><span>Requests</span><strong>${fmtCount(hoverMeta.count)}</strong></div>
          <div class="tooltip-row"><span>Errors</span><strong>${fmtCount(hoverMeta.errors)}</strong></div>
          <div class="tooltip-row"><span>Error rate</span><strong>${fmtPct(hoverMeta.count > 0 ? (hoverMeta.errors / hoverMeta.count) * 100 : 0)}</strong></div>
          <div class="tooltip-row"><span>Avg duration</span><strong>${fmtMs(hoverMeta.avg)}</strong></div>
          <div class="tooltip-row"><span>P95 duration</span><strong>${fmtMs(hoverMeta.p95)}</strong></div>
        </div>
      `}
    </div>
    <div class="analytics-legend">
      <span class="legend-item"><span class="legend-line" style="background:var(--accent)"></span>Requests/min</span>
      <span class="legend-item"><span class="legend-line" style="background:var(--error)"></span>Average duration</span>
    </div>
  `;
}

function RequestsBarChart({ points }) {
  const data = useMemo(() => downsamplePoints(points, 120), [points]);
  if (!data || data.length === 0) {
    return html`<div class="analytics-empty">No request volume in selected window</div>`;
  }
  const width = 1000;
  const height = 220;
  const padX = 12;
  const padY = 14;
  const innerW = width - padX * 2;
  const innerH = height - padY * 2;
  const maxCount = Math.max(1, ...data.map(p => Number(p.count) || 0));
  const barW = innerW / Math.max(data.length, 1);

  return html`
    <div class="analytics-chart-box">
      <svg class="analytics-chart" viewBox=${`0 0 ${width} ${height}`} preserveAspectRatio="none">
        <line x1=${padX} y1=${height - padY} x2=${width - padX} y2=${height - padY} stroke="var(--border)" stroke-width="1" />
        ${data.map((p, i) => {
          const count = Number(p.count) || 0;
          const h = (count / maxCount) * innerH;
          const x = padX + i * barW + Math.max(1, barW * 0.1);
          const y = height - padY - h;
          const w = Math.max(1, barW * 0.8);
          return html`<rect key=${p.ts || i} x=${x} y=${y} width=${w} height=${h} fill="var(--accent)" opacity=${count > 0 ? "0.8" : "0.25"} />`;
        })}
      </svg>
    </div>
    <div class="analytics-legend">
      <span class="legend-item"><span class="legend-line" style="background:var(--accent)"></span>Requests per bucket</span>
    </div>
  `;
}

function parseDetailsObject(raw) {
  if (!raw) return null;
  if (typeof raw === 'object') return raw;
  if (typeof raw !== 'string') return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function extractTraceEvents(detailsObj) {
  if (!detailsObj || typeof detailsObj !== 'object') return [];
  if (Array.isArray(detailsObj.trace)) return detailsObj.trace;
  if (Array.isArray(detailsObj.spans)) return detailsObj.spans;
  return [];
}

function fileDisplayName(file) {
  if (!file || typeof file !== 'object') return '';
  if (typeof file.name === 'string' && file.name) return file.name;
  if (typeof file.path === 'string' && file.path) {
    const parts = file.path.split('/');
    return parts[parts.length - 1] || file.path;
  }
  if (typeof file.url === 'string' && file.url) {
    const clean = file.url.split('?')[0];
    const parts = clean.split('/');
    return parts[parts.length - 1] || clean;
  }
  return '';
}

function normalizeFileItems(value) {
  return Array.isArray(value) ? value.filter(file => file && typeof file === 'object') : [];
}

function isImageFile(file) {
  return !!(file && typeof file.mime === 'string' && file.mime.startsWith('image/'));
}

function toNum(v, fallback = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function buildTraceTimeline(events) {
  const rows = (Array.isArray(events) ? events : []).map((e, i) => {
    const ms = toNum(e && (e.ms != null ? e.ms : e.durationMs), 0);
    const s = toNum(e && e.started, NaN);
    const f = toNum(e && e.finished, NaN);
    return {
      i,
      raw: e || {},
      ms: Math.max(0, ms),
      hasRange: Number.isFinite(s) && Number.isFinite(f) && f >= s,
      start: s,
      finish: f,
    };
  });
  if (rows.length === 0) return { rows: [], totalMs: 0 };

  let cursor = 0;
  for (const r of rows) {
    if (r.hasRange) {
      r.relStart = r.start;
      r.relEnd = r.finish;
    } else {
      r.relStart = cursor;
      r.relEnd = cursor + r.ms;
      cursor = r.relEnd;
    }
  }

  const minStart = Math.min(...rows.map(r => toNum(r.relStart, 0)));
  const maxEnd = Math.max(...rows.map(r => toNum(r.relEnd, 0)));
  const totalMs = Math.max(1, maxEnd - minStart);

  for (const r of rows) {
    const startMs = Math.max(0, toNum(r.relStart, 0) - minStart);
    const endMs = Math.max(startMs, toNum(r.relEnd, startMs));
    const dur = Math.max(1, endMs - startMs);
    r.offsetPct = (startMs / totalMs) * 100;
    r.widthPct = (dur / totalMs) * 100;
  }

  return { rows, totalMs };
}

function AnalyticsPanel({ page = 'volume' }) {
  const [section,setSection] = useState('overview');
  const isPerformance = page === 'performance';
  const [supported, setSupported] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const [windowSize, setWindowSize] = useState('24h');
  const [config, setConfig] = useState(null);
  const [series, setSeries] = useState({ points: [], summary: { count: 0, errorCount: 0, errorRate: 0, avgMs: 0, p95Ms: 0 }, routes: [], droppedEvents: 0, retentionHours: 168 });
  const [runtimeStats, setRuntimeStats] = useState(null);
  const [selectedType, setSelectedType] = useState('request');
  const [routeName, setRouteName] = useState('');
  const [logs, setLogs] = useState([]);
  const [logPage, setLogPage] = useState(1);
  const [logPages, setLogPages] = useState(1);
  const [logTotal, setLogTotal] = useState(0);
  const [logSearch, setLogSearch] = useState('');
  const [logSearchQuery, setLogSearchQuery] = useState('');
  const [selectedLog, setSelectedLog] = useState(null);
  const [slowMs, setSlowMs] = useState(250);

  const loadConfig = useCallback(async () => {
    try {
      const data = await api('/analytics/config');
      if (!data || !data.enabled) {
        setSupported(false);
        return;
      }
      setSupported(true);
      setConfig(data);
      const routeTypes = Array.isArray(data.routeTypes) && data.routeTypes.length > 0 ? data.routeTypes : ['request'];
      setSelectedType(prev => routeTypes.includes(prev) ? prev : routeTypes[0]);
    } catch {
      setSupported(false);
    }
  }, []);

  const loadSeries = useCallback(async () => {
    if (!supported) return;
    const params = new URLSearchParams({ window: windowSize });
    if (selectedType) params.set('routeType', selectedType);
    if (routeName) params.set('routeName', routeName);
    try {
      const data = await api('/analytics/timeseries?' + params.toString());
      if (data && data.data) {
        setSeries(data.data);
      }
    } catch (err) {
      showToast(err.message || 'Failed to load metrics', 'error');
    }
  }, [supported, windowSize, selectedType, routeName]);

  const loadLogs = useCallback(async (pageArg, queryArg) => {
    if (!supported) return;
    const pg = pageArg || logPage;
    const q = queryArg !== undefined ? queryArg : logSearchQuery;
    const params = new URLSearchParams({ page: String(pg), limit: '50' });
    if (selectedType) params.set('routeType', selectedType);
    if (q) {
      const isFilter = /[=<>~]|!=|!~/.test(q);
      params.set(isFilter ? 'filter' : 'search', q);
    }
    try {
      const data = await api('/analytics/logs?' + params.toString());
      if (data) {
        setLogs(data.rows || []);
        setLogPages(data.pages || 1);
        setLogTotal(data.total || 0);
      }
    } catch (err) {
      showToast(err.message || 'Failed to load request logs', 'error');
    }
  }, [supported, logPage, logSearchQuery, selectedType]);

  const loadRuntime = useCallback(async () => {
    if (!supported) return;
    try {
      const data = await api('/analytics/runtime');
      if (data && data.data) setRuntimeStats(data.data);
    } catch {
      // Best effort: runtime stats are informational only.
    }
  }, [supported]);

  useEffect(() => {
    loadConfig().finally(() => setLoaded(true));
  }, []);

  useEffect(() => {
    if (!supported) return;
    loadSeries();
    loadRuntime();
  }, [supported, loadSeries]);

  useEffect(() => {
    setRouteName('');
    setLogPage(1);
    setSelectedLog(null);
  }, [selectedType]);

  useEffect(() => {
    if (!supported) return;
    loadLogs(logPage, logSearchQuery);
  }, [supported, logPage, logSearchQuery, loadLogs]);

  useEffect(() => {
    if (!selectedLog) return;
    const found = logs.find(l => String(l.id) === String(selectedLog.id));
    if (!found) setSelectedLog(null);
    else if (found !== selectedLog) setSelectedLog(found);
  }, [logs, selectedLog]);

  useEffect(() => {
    if (!supported) return;
    const id = setInterval(() => {
      loadConfig();
      loadSeries();
      loadLogs(logPage, logSearchQuery);
      loadRuntime();
    }, 10000);
    return () => clearInterval(id);
  }, [supported, loadConfig, loadSeries, loadLogs, loadRuntime, logPage, logSearchQuery]);

  const applyLogFilter = useCallback(() => {
    setLogSearchQuery(logSearch.trim());
    setLogPage(1);
  }, [logSearch]);

  const onLogSearchKey = useCallback((e) => {
    if (e.key === 'Enter') { e.preventDefault(); applyLogFilter(); }
  }, [applyLogFilter]);

  if (!loaded) {
    return html`<div class="empty-state"><div class="empty-title">Loading analytics…</div></div>`;
  }
  if (!supported) {
    return html`<div class="empty-state"><div class="empty-title">Analytics unavailable</div><div class="empty-desc">This runtime does not expose request analytics endpoints.</div></div>`;
  }

  const summary = series.summary || { count: 0, errorCount: 0, errorRate: 0, avgMs: 0, p95Ms: 0 };

  const selectedDetails = parseDetailsObject(selectedLog && selectedLog.details);

  const traceTimeline = buildTraceTimeline(traceEvents);
  const routeTypes = Array.isArray(config?.routeTypes) && config.routeTypes.length > 0 ? config.routeTypes : ['request'];
  const typeLabelPlural = routeTypeLabel(selectedType, true);

  return html`
    <div class=${"analytics-panel analytics-section-"+section}>

          </select>
        </div>
      </div>

        ${routeTypes.length > 1 && html`
          <div class="analytics-route-list">
            ${routeTypes.map(type => html`
              <button

                onClick=${() => setSelectedType(type)}

          </div>

          <div class="analytics-main">
            <div class="analytics-cards">
              <div class="analytics-card"><div class="analytics-card-label">${typeLabelPlural}</div><div class="analytics-card-value">${fmtCount(summary.count)}</div></div>
              <div class="analytics-card"><div class="analytics-card-label">Errors</div><div class="analytics-card-value">${fmtCount(summary.errorCount)}</div></div>
              <div class="analytics-card"><div class="analytics-card-label">Error Rate</div><div class="analytics-card-value">${fmtPct(summary.errorRate)}</div></div>
              <div class="analytics-card"><div class="analytics-card-label">Avg Duration</div><div class="analytics-card-value">${fmtMs(summary.avgMs)}</div></div>
              <div class="analytics-card"><div class="analytics-card-label">P95 Duration</div><div class="analytics-card-value">${fmtMs(summary.p95Ms)}</div></div>
              ${isPerformance && html`<div class="analytics-card"><div class="analytics-card-label">Slow (${fmtMs(slowMs)}+)</div><div class="analytics-card-value">${fmtCount(slowLogs.length)}</div></div>`}
              ${isPerformance && html`<div class="analytics-card"><div class="analytics-card-label">Routes</div><div class="analytics-card-value">${fmtCount((series.routes || []).length)}</div></div>`}
              ${!isPerformance && html`<div class="analytics-card"><div class="analytics-card-label">Dropped Events</div><div class="analytics-card-value">${fmtCount(series.droppedEvents)}</div></div>`}
            </div>

            <div class="analytics-chart-wrap">
              <div class="analytics-chart-title">
                <span>${isPerformance ? `${typeLabelPlural} duration and volume over time` : `${typeLabelPlural} volume over time`}</span>
                <span>Retention: ${Number(series.retentionHours || (config && config.retentionHours) || 168).toFixed(0)}h</span>
              </div>
              ${isPerformance
                ? html`<${AnalyticsChart} points=${series.points || []} />`
                : html`<${RequestsBarChart} points=${series.points || []} />`}
            </div>

            ${isPerformance && html`
              <div class="analytics-route-list">
                <button class=${"analytics-route-chip" + (!routeName ? " active" : "")} onClick=${() => { setRouteName(''); }}>All routes</button>
                ${routeChips.map(rt => html`
                  <button
                    key=${rt.routeType + ':' + rt.routeName}
                    class=${"analytics-route-chip" + (routeName === rt.routeName ? " active" : "")}
                    onClick=${() => { setRouteName(rt.routeName); setLogPage(1); }}
                  >
                    ${rt.routeName || '(unnamed)'} · ${fmtCount(rt.count)}
                  </button>
                `)}
              </div>
            `}

            <div class="analytics-logs">
              <div class="panel-toolbar">
                <div class="panel-title">
                  <span class="panel-title-icon">${icons.table}</span>
                  ${isPerformance ? `${typeLabelSingle} Performance` : `${typeLabelSingle} Events`}
                  <span class="panel-meta">${fmtCount(logTotal)} rows</span>
                </div>
                <div class="panel-actions">
                  ${isPerformance && html`
                    <div class="search-box">
                      <span style="color:var(--text-faint);font-size:14px">slow ≥</span>

                    </div>
                  `}
                  <div class="search-box">

                    <input type="text" aria-label="Filter events" placeholder='routeName~"get_" durationMs>=20' value=${logSearch} onInput=${e => setLogSearch(e.target.value)} onKeyDown=${onLogSearchKey} />

                      <tr key=${row.id} class="log-row" tabindex="0" aria-label=${"Inspect request " + row.routeName} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSelectedLog(row); } }} onClick=${() => setSelectedLog(row)}>
                        <td>${fmtTime(row.ts)}</td>
                        <td>${row.routeType}/${row.routeName}</td>
                        <td>${row.status}</td>
                        <td>
                          ${fmtMs(row.durationMs)}

                  <span class="page-info">Page ${logPage} of ${logPages}</span>

          ${selectedLog && html`
            <aside class="analytics-detail">
              <div class="analytics-detail-header">

                  <div class="panel-meta">${selectedLog.routeType}/${selectedLog.routeName}</div>
