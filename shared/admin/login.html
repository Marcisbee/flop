body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}

.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:550}
.field input{width:100%;padding:12px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:8px;color:var(--text);font-size:16px;outline:none}
.field input:focus{border-color:var(--accent)}
button[type="submit"]{width:100%;padding:10px;background:#0969da;border:none;border-radius:8px;color:#ffffff;font-size:14px;font-weight:500;cursor:pointer;margin-top:4px}
button[type="submit"]:hover{background:#0759bc}
.error{color:var(--error);font-size:13px;margin-top:12px;text-align:center}
.hidden{display:none}
.auth-title{font-size:26px;letter-spacing:-.7px;text-align:center;color:var(--text-heading);margin-bottom:8px}

<body><div class="auth-shell"><header class="auth-intro"><a class="auth-brand" href="/_">flop<span>Console</span></a></header>
<div class="login-container">
  <h1 class="auth-title">Sign in to Flop</h1><p class="auth-description">Sign in to manage your Flop database.</p>
  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Sign In</button>
    <div id="error" role="alert" class="error hidden"></div>
  </form>
</div></div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  errEl.classList.add('hidden');
  const submit = e.currentTarget.querySelector('button[type=submit]');
  submit.disabled = true;
  try {
    const res = await fetch('/_/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('flop_admin_token', data.token);
    if (data.refreshToken) localStorage.setItem('flop_admin_refresh', data.refreshToken);
    window.location.href = '/_';
  } catch(err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally { submit.disabled = false; }
});
</script>
