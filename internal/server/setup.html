<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flop Admin - Setup</title>
<style>
:root{color-scheme:dark;--accent:#4c8dff;--accent-hover:#6ba1ff;--accent-soft:rgba(76,141,255,.14);--error:#ff7d86;--bg:#101218;--bg-surface:#161920;--bg-input:#11141a;--border:#292e39;--border-input:#363d4a;--text:#d8dce5;--text-heading:#f7f8fb;--text-muted:#9ba3b1;--text-faint:#737c8c;--shadow:0 18px 55px rgba(0,0,0,.32);--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme:light){:root{color-scheme:light;--accent:#356fd1;--accent-hover:#245fbe;--accent-soft:rgba(53,111,209,.11);--error:#c83f4b;--bg:#f4f5f7;--bg-surface:#fff;--bg-input:#fff;--border:#dfe3e8;--border-input:#cfd5dd;--text:#343b46;--text-heading:#171b22;--text-muted:#66707f;--text-faint:#7d8795;--shadow:0 18px 50px rgba(31,43,62,.14)}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% -10%,var(--accent-soft),transparent 42%),var(--bg);color:var(--text);font:12.5px/1.4 var(--sans)}
.login-container{width:100%;max-width:344px;padding:24px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.logo svg{width:28px;height:28px}
.logo-text{color:var(--text-heading);font-size:21px;font-weight:700;letter-spacing:-.04em}
.subtitle{margin-bottom:20px;color:var(--text-faint);font-size:11.5px;text-align:center}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;color:var(--text-muted);font-size:10.5px;font-weight:570}
.field input,.field select{width:100%;height:32px;padding:5px 8px;outline:0;background:var(--bg-input);border:1px solid var(--border-input);border-radius:5px;color:var(--text);font:inherit}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
button[type=submit]{width:100%;height:32px;margin-top:4px;background:var(--accent);border:1px solid var(--accent);border-radius:5px;color:#fff;font:600 11.5px var(--sans);cursor:pointer}
button[type=submit]:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.error{margin-top:10px;padding:6px 8px;background:rgba(255,125,134,.1);border-radius:4px;color:var(--error);font-size:10.5px;text-align:center}
.hidden{display:none}

:root{--accent:#7c5cff;--accent-hover:#9278ff;--accent-soft:rgba(124,92,255,.13);--error:#fb7185;--bg:#080b12;--bg-surface:#111622;--bg-elevated:#171d2a;--bg-input:#0d111b;--border:rgba(148,163,184,.15);--border-input:rgba(148,163,184,.23);--text:#d8dfeb;--text-heading:#f8fafc;--text-muted:#98a4b7;--text-faint:#6f7c90;--shadow:0 30px 80px rgba(0,0,0,.42)}
@media (prefers-color-scheme:light){:root{--accent:#6d4aff;--accent-hover:#5c3be8;--accent-soft:rgba(109,74,255,.09);--error:#e11d48;--bg:#eef1f6;--bg-surface:#fff;--bg-elevated:#f7f8fb;--bg-input:#fbfcfe;--border:rgba(71,85,105,.14);--border-input:rgba(71,85,105,.22);--text:#3d4757;--text-heading:#161b26;--text-muted:#657185;--text-faint:#8490a3;--shadow:0 30px 80px rgba(35,43,66,.16)}}
body{
  padding:28px;
  background:
    radial-gradient(circle at 14% 8%,rgba(124,92,255,.15),transparent 30%),
    radial-gradient(circle at 86% 90%,rgba(45,212,191,.08),transparent 30%),
    var(--bg);
  font-size:12px;
}
.auth-shell{
  width:min(960px,100%);
  max-height:calc(100vh - 56px);
  display:grid;
  grid-template-columns:1.02fr .98fr;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--bg-surface);
  box-shadow:var(--shadow);
}
.auth-aside{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:38px;
  background:
    radial-gradient(circle at 92% 8%,rgba(45,212,191,.27),transparent 28%),
    linear-gradient(145deg,#7659ff 0%,#5535d6 48%,#252054 100%);
  color:#fff;
}
.auth-aside:before,.auth-aside:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.1);border-radius:50%}
.auth-aside:before{width:320px;height:320px;right:-190px;bottom:-110px}
.auth-aside:after{width:180px;height:180px;right:-90px;bottom:-40px}
.aside-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:760;letter-spacing:-.03em}
.aside-brandmark{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px rgba(255,255,255,.18)}
.aside-brandmark svg{width:19px;height:19px;color:#fff}
.aside-copy{position:relative;z-index:1;max-width:360px}
.eyebrow{margin-bottom:10px;color:rgba(255,255,255,.62);font-size:9px;font-weight:760;letter-spacing:.16em;text-transform:uppercase}
.aside-copy h1{max-width:350px;font-size:38px;line-height:1.04;font-weight:760;letter-spacing:-.055em}
.aside-copy p{max-width:340px;margin-top:15px;color:rgba(255,255,255,.68);font-size:12px;line-height:1.65}
.aside-steps{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px}
.aside-step{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.72);font-size:10px;font-weight:600}
.aside-step span{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:7px;background:rgba(8,11,18,.14);color:#fff;font-size:9px}
.login-container{max-width:none;overflow:auto;padding:38px 46px;border:0;border-radius:0;background:var(--bg-surface);box-shadow:none}
.form-wrap{width:100%;max-width:390px;margin:auto}
.form-icon{width:42px;height:42px;display:grid;place-items:center;margin-bottom:18px;border-radius:12px;background:var(--accent-soft);color:var(--accent-hover)}
.form-icon svg{width:22px;height:22px}
.form-kicker{margin-bottom:6px;color:var(--accent-hover);font-size:9px;font-weight:760;letter-spacing:.14em;text-transform:uppercase}
.form-title{color:var(--text-heading);font-size:25px;font-weight:750;letter-spacing:-.04em}
.subtitle{margin:5px 0 22px;color:var(--text-faint);font-size:11px;text-align:left}
.field{margin-bottom:12px}
.field label{margin-bottom:5px;color:var(--text-muted);font-size:10px;font-weight:650}
.field input,.field select{height:38px;padding:7px 11px;border-color:var(--border-input);border-radius:9px;background:var(--bg-input);font-size:12px;transition:border-color .15s,box-shadow .15s,background .15s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button[type=submit]{height:40px;margin-top:6px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--accent-hover),#6547ed);font-size:11.5px;font-weight:680;box-shadow:0 10px 22px rgba(101,71,237,.28),inset 0 1px rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s}
button[type=submit]:hover{transform:translateY(-1px);background:linear-gradient(135deg,#a18cff,var(--accent));box-shadow:0 13px 26px rgba(101,71,237,.34)}
.error{margin-top:13px;padding:8px 10px;border:1px solid rgba(251,113,133,.18);border-radius:8px;font-size:10px}
@media (max-width:760px){
  body{padding:16px}
  .auth-shell{max-width:430px;max-height:calc(100vh - 32px);grid-template-columns:1fr;border-radius:18px}
  .auth-aside{min-height:150px;padding:22px}
  .aside-copy h1{font-size:25px}
  .aside-copy p,.aside-steps{display:none}
  .login-container{padding:28px 25px 32px}
  .form-icon{display:none}
}
</style>
</head>
<body>
<main class="auth-shell">
  <section class="auth-aside">
    <div class="aside-brand">
      <span class="aside-brandmark">
        <svg viewBox="0 0 16 16" fill="currentColor"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M13.5 5.5c0 1.1-2.46 2-5.5 2s-5.5-.9-5.5-2M2.5 3.5v9c0 1.1 2.46 2 5.5 2s5.5-.9 5.5-2v-9M13.5 8.5c0 1.1-2.46 2-5.5 2s-5.5-.9-5.5-2" fill="none" stroke="currentColor"/></svg>
      </span>
      flop
    </div>
    <div class="aside-copy">
      <div class="eyebrow">First-time setup</div>
      <h1>Start with solid foundations.</h1>
      <p>Create the administrator account that will manage this Flop database.</p>
    </div>
    <div class="aside-steps">
      <div class="aside-step"><span>1</span>Create admin credentials</div>
      <div class="aside-step"><span>2</span>Sign in to the console</div>
      <div class="aside-step"><span>3</span>Manage your database</div>
    </div>
  </section>
  <section class="login-container">
    <div class="form-wrap">
      <div class="form-icon">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5A3.5 3.5 0 104.5 5 3.5 3.5 0 008 1.5zm0 1A2.5 2.5 0 118 7.5 2.5 2.5 0 018 2.5zM2 14.5v-1.25C2 10.9 4.68 9 8 9s6 1.9 6 4.25v1.25h-1v-1.25C13 11.55 10.76 10 8 10s-5 1.55-5 3.25v1.25H2z"/></svg>
      </div>
      <div class="form-kicker">Admin console</div>
      <h2 class="form-title">Create your account</h2>
      <p class="subtitle">Set up the administrator for this database.</p>
      <form id="setup-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" placeholder="admin@example.com" required autofocus>
        </div>
        <div id="extra-fields"></div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" placeholder="Repeat your password" required minlength="6">
        </div>
        <button type="submit">Create Admin</button>
        <div id="error" class="error hidden"></div>
      </form>
    </div>
  </section>
</main>
<script>
const extraFieldNames = [];

function toLabel(name) {
  return name.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
}

async function loadExtraFields() {
  try {
    const res = await fetch('/_/api/setup-schema');
    const data = await res.json();
    if (!data.fields || !data.fields.length) return;
    const container = document.getElementById('extra-fields');
    data.fields.forEach(f => {
      extraFieldNames.push(f.name);
      const div = document.createElement('div');
      div.className = 'field';
      const label = document.createElement('label');
      label.setAttribute('for', 'extra-' + f.name);
      label.textContent = toLabel(f.name);
      div.appendChild(label);
      if (f.type === 'enum' && f.enumValues && f.enumValues.length) {
        const select = document.createElement('select');
        select.id = 'extra-' + f.name;
        if (f.required) select.required = true;
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = 'Select...';
        select.appendChild(empty);
        f.enumValues.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });
        div.appendChild(select);
      } else {
        const input = document.createElement('input');
        input.id = 'extra-' + f.name;
        if (f.type === 'integer' || f.type === 'number') input.type = 'number';
        else input.type = 'text';
        if (f.required) input.required = true;
        div.appendChild(input);
      }
      container.appendChild(div);
    });
  } catch(e) {}
}

loadExtraFields();

document.getElementById('setup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const errEl = document.getElementById('error');
  errEl.classList.add('hidden');
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match';
    errEl.classList.remove('hidden');
    return;
  }
  const token = new URLSearchParams(window.location.search).get('token');
  const body = { token, email, password };
  extraFieldNames.forEach(n => {
    const el = document.getElementById('extra-' + n);
    if (el && el.value) body[n] = el.type === 'number' ? Number(el.value) : el.value;
  });
  try {
    const res = await fetch('/_/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Setup failed');
    window.location.href = '/_/login';
  } catch(err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
});
</script>
</body></html>
